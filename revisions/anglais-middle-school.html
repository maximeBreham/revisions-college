<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Middle school is cool · Révisions 6e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../exercices/moteur.css">
<style>
/* la couleur de l'anglais remplace le bleu du moteur */
:root{--blue:#B0225A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--blue:#F07AA6}}
:root[data-theme="dark"]{--blue:#F07AA6}

/* accueil */
.hero{padding:26px 2px 14px}
.hero h1{font-size:clamp(32px,9vw,50px);font-weight:700;letter-spacing:-.01em;line-height:1.1}
.hero h1 span{background:linear-gradient(transparent 62%,var(--hl) 62%,var(--hl) 92%,transparent 92%)}
.hero .sub{color:var(--ink-soft);margin-top:8px}
.hero svg{display:block;width:100%;max-width:420px;height:auto;margin-top:14px}
.menu{list-style:none;margin:8px 0 0;padding:0;background:var(--card);border-radius:var(--r-lg);border:2px solid var(--line);overflow:hidden}
.menu li+li{border-top:2px solid var(--line)}
.menu button{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;padding:14px;background:none;border:0;text-align:left;cursor:pointer}
.menu .ic{font-family:var(--head);font-weight:700;font-size:18px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--paper);color:var(--blue);border:2px solid var(--line)}
.menu .t{font-family:var(--head);font-weight:600;font-size:19px;display:block}
.menu .d{font-size:14px;color:var(--ink-soft);display:block}
.menu .chev{font-size:22px;color:var(--ink-soft)}
.exam-btn{display:block;width:100%;margin-top:18px;padding:18px 20px;border:0;border-radius:var(--r-lg);background:var(--blue);color:var(--on-ink);text-align:left;cursor:pointer}
.exam-btn .t{font-family:var(--head);font-weight:700;font-size:25px;display:block}
.exam-btn .d{font-size:14px;opacity:.9}
.foot{margin-top:22px;font-size:14px;color:var(--ink-soft)}

/* le cours */
.bloc{background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
.bloc h3{font-family:var(--head);font-weight:600;font-size:20px;margin:0 0 8px;color:var(--blue)}
.bloc p{margin:8px 0}
.bloc ul{margin:8px 0;padding-left:20px}
.bloc li{margin:4px 0}
.en{font-weight:600;color:var(--blue)}
.formule{font-family:var(--head);font-weight:600;font-size:18px;text-align:center;padding:10px;border-radius:var(--r-md);background:var(--paper);border:2px dashed var(--line);margin:10px 0}
.piege{border-color:var(--red)}
.piege h3{color:var(--red)}
.piege .non{color:var(--red);text-decoration:line-through}
.piege .oui{color:var(--green);font-weight:600}
.complement{font-size:14px;color:var(--ink-soft)}
.sous{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.sous button{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:14px;cursor:pointer}
.sous button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);font-weight:600}

/* tableaux */
.tab{width:100%;border-collapse:collapse;background:var(--card);font-size:16px}
.tab th,.tab td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tab th{font-family:var(--head);font-weight:600;font-size:15px;color:var(--ink-soft)}
.tab td+td,.tab th+th{border-left:1px solid var(--line)}
.tab tr:last-child td{border-bottom:0}
.tabbox{border:2px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin:10px 0}
.titre{margin-top:8px;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.say{border:0;background:none;cursor:pointer;font-size:17px;padding:0 4px;color:var(--ink-soft)}
.note{display:block;font-size:13px;color:var(--ink-soft)}
.svopt{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.svopt span{border-radius:10px;padding:6px 9px;font-size:15px;border:2px solid var(--line);background:var(--paper)}
.svopt b{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em}

/* cartes */
.face{display:block;width:100%;min-height:220px;border-radius:var(--r-lg);padding:26px 20px;text-align:center;border:2px solid var(--line);cursor:pointer}
.face.front{background:var(--card);padding-top:50px}
.face.back{display:none;background:var(--ink);color:var(--paper);border-color:var(--ink);padding-top:44px}
.fcard.on .front{display:none}.fcard.on .back{display:block}
.face .w{display:block;font-family:var(--head);font-weight:600;font-size:26px;line-height:1.3}
.face .hint{display:block;margin-top:30px;font-size:14px;opacity:.7}
.face .lab{display:block;font-size:15px;opacity:.75;margin-bottom:10px}
.face .note{color:inherit;opacity:.75;margin-top:14px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two button{padding:14px;border-radius:var(--r-md);border:0;font-family:var(--head);font-weight:600;font-size:19px;cursor:pointer}
.b-bad{background:var(--bad-bg);color:var(--red)} .b-ok{background:var(--ok-bg);color:var(--green)}
.counter{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-soft);margin-bottom:6px}
.ecoute{display:block;margin:10px auto 0;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;font-size:15px;cursor:pointer}

/* remettre les mots dans l'ordre */
.ligne{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px;border-radius:var(--r-md);border:2px dashed var(--line);background:var(--card);margin:10px 0}
.ligne.ok{border-style:solid;border-color:var(--green);background:var(--ok-bg)} .ligne.bad{border-style:solid;border-color:var(--red);background:var(--bad-bg)}
.tuiles{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tuile{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:18px;cursor:pointer;font-family:var(--body)}
.ligne .tuile{border-color:var(--blue)}
.tuile:disabled{opacity:.25;cursor:default}
.fr-phrase{font-size:15px;color:var(--ink-soft)}
.recap .it{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.recap .it b{display:block}
</style>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icones/icone-180.png">
<meta name="apple-mobile-web-app-title" content="Révisions">
</head>
<body>
<main class="wrap" id="app"></main>
<script src="../exercices/moteur.js"></script>
<script src="../exercices/anglais-middle-school.js"></script>
<script>
const { h, esc, shuffle } = Moteur;
const B = Moteur.banques["anglais-middle-school"];
const THEMES = B.ecrire.themes;
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
const store = { get(k, d) { try { const v = localStorage.getItem("an6:" + k); return v ? JSON.parse(v) : d } catch (e) { return d } }, set(k, v) { try { localStorage.setItem("an6:" + k, JSON.stringify(v)) } catch (e) {} } };
const Maj = s => s.charAt(0).toUpperCase() + s.slice(1);

/* Prononciation : la voix anglaise du téléphone, s'il en a une */
const parle = txt => { try { const s = window.speechSynthesis; if (!s) return; s.cancel(); const u = new SpeechSynthesisUtterance(txt.replace(/\(.*?\)/g, "")); u.lang = "en-GB"; u.rate = .85;
  const v = s.getVoices().find(v => /^en[-_]GB/i.test(v.lang)) || s.getVoices().find(v => /^en/i.test(v.lang)); if (v) u.voice = v; s.speak(u) } catch (e) {} };
const peutParler = "speechSynthesis" in window;
const bouton = txt => peutParler ? `<button class="say" data-say="${esc(txt)}" aria-label="Écouter ${esc(txt)}">🔊</button>` : "";
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) { e.stopPropagation(); parle(b.dataset.say) } }, true);

function chrome(title) { app.innerHTML = ""; const top = h(`<div class="top"><button class="back" aria-label="Retour au menu">‹</button><h2>${title}</h2></div>`); top.querySelector(".back").onclick = () => { location.hash = "" }; app.append(top); const body = h("<div></div>"); app.append(body); window.scrollTo(0, 0); return body }
function bar(el) { const b = h('<div class="bar"><i></i></div>'); el.prepend(b); return p => b.firstChild.style.width = (p * 100) + "%" }
function tabs(el, items, onPick, cls = "tabs") { const t = h(`<div class="${cls}">${items.map(([k, l]) => `<button data-k="${k}">${l}</button>`).join("")}</div>`); el.append(t); const set = k => { t.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k)); onPick(k) }; t.querySelectorAll("button").forEach(b => b.onclick = () => set(b.dataset.k)); set(items[0][0]); return t }
function nextBtn(el, onDone, label) { const nx = h(`<button class="main-btn">${label}</button>`); nx.onclick = onDone; el.append(nx); return nx }
function serie(zone, n, gen) {
  zone.innerHTML = ""; let k = 0, good = 0; const setP = bar(zone); const inner = h("<div></div>"); zone.append(inner);
  const step = () => { setP(k / n); window.scrollTo(0, 0);
    if (k === n) { inner.innerHTML = ""; inner.append(h(`<div class="score"><div class="n">${good}/${n}</div><p class="prompt">${good === n ? "Sans faute !" : good >= n * .7 ? "Très bien !" : "Continue, ça rentre !"}</p></div>`)); nextBtn(inner, () => serie(zone, n, gen), "Une autre série"); return }
    gen().run(inner, `Question ${k + 1} sur ${n}`, ok => { if (ok) good++; k++; step() }) }; step();
}

/* ===== 1. LE COURS ===== */
const ORDRE_THEMES = [["matieres", "Matières"], ["fournitures", "Fournitures"], ["lieux", "Lieux"], ["routine", "Routine"], ["college", "Project 1"]];
function listeVocab(cle) {
  const t = THEMES[cle];
  return `<div class="tabbox"><table class="tab"><tr><th>${esc(t.en)}</th><th>${esc(t.nom)}</th></tr>${t.mots.map(m => `<tr><td><span class="en">${esc(m.en)}</span>${bouton(m.en)}${m.note ? `<span class="note">${esc(m.note)}</span>` : ""}</td><td>${esc(m.fr)}</td></tr>`).join("")}</table></div>`;
}
function cours() {
  const body = chrome("Le cours"); const zone = h("<div></div>");
  tabs(body, [["vocab", "Vocabulaire"], ["present", "Présent simple"], ["ordre", "Ordre des mots"], ["pieges", "Pièges"]], k => {
    zone.innerHTML = ""; window.scrollTo(0, 0);
    if (k !== "vocab") return zone.append(h(`<div>${COURS[k]}</div>`));
    const liste = h("<div></div>");
    tabs(zone, ORDRE_THEMES, c => { liste.innerHTML = listeVocab(c) + (EN_PLUS[c] || "") }, "sous"); zone.append(liste);
  }); body.append(zone);
}
const EN_PLUS = {
  college: `<div class="bloc"><h3>Décrire une image</h3><ul>
    <li><span class="en">On the picture, I can see a backpack.</span> Sur l'image, je vois un sac à dos.</li>
    <li><span class="en">There is a pupil.</span> Il y a un élève (un seul).</li>
    <li><span class="en">There are also lockers.</span> Il y a aussi des casiers (plusieurs : -s).</li></ul></div>`,
  routine: `<div class="bloc"><h3>My daily routine, avec les heures</h3>
    <p><span class="en">I wake up at 7 am. I get up at 7:05 and I get dressed. I have breakfast at 7:15. I brush my teeth at 7:30, I comb my hair at 7:35 and I go to school at 7:40.</span>${bouton("I wake up at 7 am. I get up at 7:05 and I get dressed. I have breakfast at 7:15. I brush my teeth at 7:30, I comb my hair at 7:35 and I go to school at 7:40.")}</p>
    <p class="complement">C'est le texte de ton cahier, corrigé : regarde l'onglet « Pièges ».</p></div>`,
};
const COURS = {
  present: `
  <div class="bloc"><h3>Quand l'utiliser ?</h3>
  <p>Le présent simple sert à parler de ce qu'on fait <b>d'habitude</b> : la routine, les goûts, ce qui est toujours vrai.</p>
  <p><span class="en">I get up at 7:05 every day.</span> Je me lève à 7 h 05 tous les jours.</p></div>
  <div class="bloc"><h3>La forme affirmative</h3>
  <div class="tabbox"><table class="tab"><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
  <tr><td>I <b>wake</b> up</td><td>she <b>wakes</b> up</td></tr>
  <tr><td>we <b>brush</b> our teeth</td><td>he <b>brushes</b> his teeth</td></tr>
  <tr><td>they <b>go</b> to school</td><td>Tom <b>goes</b> to school</td></tr>
  <tr><td>you <b>have</b> breakfast</td><td>my sister <b>has</b> breakfast</td></tr></table></div>
  <p class="formule">he / she / it → verbe + <span style="color:var(--blue)">s</span></p>
  <ul><li>En général, on ajoute <b>-s</b> : wakes, gets, takes, combs, likes, plays.</li>
  <li>Après <b>-sh, -ch, -s, -x, -o</b>, on ajoute <b>-es</b> : brush<b>es</b>, watch<b>es</b>, go<b>es</b>, do<b>es</b>.</li>
  <li><b>have</b> devient <b>has</b> : she has breakfast.</li>
  <li>Attention : <b>my</b> change aussi. I brush <b>my</b> teeth → she brushes <b>her</b> teeth, he combs <b>his</b> hair.</li></ul></div>
  <div class="bloc"><h3>La forme négative</h3>
  <p class="formule">sujet + don't / doesn't + verbe</p>
  <ul><li><span class="en">I don't like maths.</span> (don't = do not)</li>
  <li><span class="en">She doesn't like maths.</span> (doesn't = does not)</li></ul>
  <p>Après <b>doesn't</b>, le verbe <b>perd son -s</b> : <span class="piege"><span class="non">she doesn't likes</span></span> → she doesn't <b>like</b>.</p></div>
  <div class="bloc"><h3>La question</h3>
  <p class="formule">Do / Does + sujet + verbe ?</p>
  <ul><li><span class="en">Do you like English?</span> — Yes, I do. / No, I don't.</li>
  <li><span class="en">Does he take a shower in the morning?</span> — Yes, he does. / No, he doesn't.</li></ul>
  <p>Avec <b>does</b>, le verbe n'a pas de -s non plus : Does she <b>get</b> up at 7?</p></div>
  <p class="complement">La grammaire n'est pas dans les photos de ton cahier : cette partie a été faite d'après des cours d'anglais de 6e en ligne, qui disent tous la même chose. Compare avec ce que ton professeur a dit en classe.</p>`,
  ordre: `
  <div class="bloc"><h3>L'ordre de la phrase</h3>
  <p>En anglais, l'ordre des mots est fixe :</p>
  <div class="svopt"><span><b>sujet</b>We</span><span><b>verbe</b>have</span><span><b>complément</b>P.E.</span><span><b>lieu</b>in the gym</span><span><b>temps</b>on Tuesday.</span></div>
  <ul><li>Le <b>lieu</b> vient avant le <b>temps</b> : He goes <b>to school at 7:40</b>.</li>
  <li>Le moment peut aussi aller tout au début : <span class="en">At 7 am, I wake up.</span></li>
  <li>Le complément vient avant le lieu : Tom reads <b>a book</b> in the library.</li></ul></div>
  <div class="bloc"><h3>L'adjectif se place avant le nom</h3>
  <ul><li><span class="en">a red pencil case</span> : une trousse rouge</li>
  <li><span class="en">a big playground</span> : une grande cour</li>
  <li><span class="en">two blue pens</span> : deux stylos bleus. L'adjectif ne prend <b>jamais de -s</b>.</li></ul></div>
  <div class="bloc"><h3>Négation et question</h3>
  <ul><li>Négatif : sujet + <b>don't / doesn't</b> + verbe : <span class="en">My sister doesn't like maths.</span></li>
  <li>Question : <b>Do / Does</b> + sujet + verbe : <span class="en">Do you like English?</span></li></ul></div>
  <p class="complement">Fait d'après des cours d'anglais en ligne, pas d'après ton cahier.</p>`,
  pieges: `
  <p class="muted">Des erreurs repérées dans ton cahier. Corrige-les avant l'éval !</p>
  <div class="bloc piege"><h3>Les dates</h3><p><span class="non">November 2th</span> → <span class="oui">November 2nd</span> · <span class="non">November 3th</span> → <span class="oui">November 3rd</span></p>
  <p>1<b>st</b>, 2<b>nd</b>, 3<b>rd</b>, puis 4<b>th</b>, 5<b>th</b>… 10<b>th</b>, 14<b>th</b>. Mais 21<b>st</b>, 22<b>nd</b>, 23<b>rd</b>.</p>
  <p><span class="non">Wednesday, october 14th</span> → <span class="oui">Wednesday, October 14th</span> : les mois et les jours prennent une majuscule.</p></div>
  <div class="bloc piege"><h3>Décrire l'image</h3>
  <p><span class="non">There are also locker</span> → <span class="oui">There are also lockers</span> (plusieurs : -s)</p>
  <p><span class="non">I can see backpack</span> → <span class="oui">I can see a backpack</span> · <span class="non">I can see pupil</span> → <span class="oui">I can see a pupil</span></p>
  <p>Un seul objet : on n'oublie pas <b>a</b> (ou <b>an</b> devant une voyelle : an eraser).</p></div>
  <div class="bloc piege"><h3>Les heures</h3>
  <p><span class="non">I wake up at 7h00 am</span> → <span class="oui">I wake up at 7 am</span> (ou at 7:00)</p>
  <p><span class="non">get up 7h05</span> → <span class="oui">I get up at 7:05</span></p>
  <p>En anglais, pas de « h » dans l'heure, et on met <b>at</b> devant : at 7:30. <b>am</b> = le matin, <b>pm</b> = l'après-midi et le soir.</p></div>
  <div class="bloc piege"><h3>L'ordre de la routine</h3>
  <p>Dans le texte, <span class="non">wake up, get dressed, get up</span> → <span class="oui">wake up, get up, get dressed</span></p>
  <p>On se réveille (wake up), on se lève (get up), <b>puis</b> on s'habille (get dressed).</p></div>
  <div class="bloc piege"><h3>L'orthographe</h3>
  <p><span class="non">comb my haire</span> → <span class="oui">comb my hair</span></p>
  <p><b>library</b> = une bibliothèque, pas une librairie. <b>trousers</b> et <b>scissors</b> sont toujours au pluriel : my trousers <b>are</b> blue.</p></div>`,
};

/* ===== 2. LES CARTES ===== */
function cartes() {
  const body = chrome("Les cartes de vocabulaire");
  body.append(h(`<p class="muted">Lis le mot en français, dis-le en anglais dans ta tête (ou à voix haute), puis retourne la carte.</p>`));
  const zone = h("<div></div>");
  tabs(body, [["tout", "Tout"], ...ORDRE_THEMES], k => start(k === "tout" ? Object.values(THEMES).flatMap(t => t.mots) : THEMES[k].mots), "sous");
  body.append(zone);
  function start(C) {
    let queue = shuffle(C.map((c, i) => i)), done = 0; next();
    function next() { zone.innerHTML = "";
      if (!queue.length) { zone.append(h(`<div class="score"><div class="n">✓</div><p class="prompt">Tous les mots sont sus !</p></div>`)); nextBtn(zone, () => start(C), "Recommencer"); return }
      const c = C[queue[0]];
      zone.append(h(`<div class="counter"><span>Mot</span><span>${done} / ${C.length} sus</span></div>`));
      const card = h(`<div class="fcard" role="button" tabindex="0" aria-label="Retourner la carte"><div class="face front"><span class="w">${esc(Maj(c.fr))}</span><span class="hint">Touche la carte pour voir l'anglais</span></div><div class="face back"><span class="lab">${esc(Maj(c.fr))}</span><span class="w">${esc(c.en)}</span>${c.note ? `<span class="note">${esc(c.note)}</span>` : ""}</div></div>`); zone.append(card);
      const ec = peutParler ? h(`<button class="ecoute" style="visibility:hidden" data-say="${esc(c.en)}">🔊 Écouter</button>`) : h("<span></span>"); zone.append(ec);
      const btns = h(`<div class="two" style="visibility:hidden"><button class="b-bad">À revoir</button><button class="b-ok">Je savais</button></div>`); zone.append(btns);
      const flip = () => { card.classList.toggle("on"); btns.style.visibility = "visible"; ec.style.visibility = "visible" }; card.onclick = flip; card.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip() } };
      btns.children[0].onclick = () => { const x = queue.shift(); queue.splice(Math.min(queue.length, 3), 0, x); next() };
      btns.children[1].onclick = () => { queue.shift(); done++; next() };
    }
  }
}

/* ===== 3. REMETTRE LES MOTS DANS L'ORDRE ===== */
function ranger() {
  const body = chrome("Remets les mots dans l'ordre");
  body.append(h(`<p class="muted">Touche les mots dans le bon ordre pour faire la phrase. Touche un mot de la phrase pour le retirer.</p>`));
  const zone = h("<div></div>"); body.append(zone);
  const nett = s => s.toLowerCase().replace(/[.?,]/g, "").replace(/\s+/g, " ").trim();
  let L = shuffle(B.ordre.phrases), k = 0, good = 0; next();
  function next() {
    zone.innerHTML = ""; const setP = bar(zone); setP(k / L.length);
    if (k === L.length) { zone.append(h(`<div class="score"><div class="n">${good}/${L.length}</div><p class="prompt">${good === L.length ? "Sans faute !" : "Recommence pour retenir l'ordre."}</p></div>`)); nextBtn(zone, () => { L = shuffle(L); k = 0; good = 0; next() }, "Recommencer"); return }
    const p = L[k], fin = p.ok.slice(-1);
    const mots = p.ok.slice(0, -1).split(" ").map((m, i) => i === 0 && m !== "I" && m !== "Tom" ? m.charAt(0).toLowerCase() + m.slice(1) : m);
    let ordre = shuffle(mots.map((m, i) => i)); if (ordre.every((x, i) => x === i)) ordre = ordre.reverse();
    zone.append(h(`<p class="muted small">${k + 1} sur ${L.length}${fin === "?" ? " · c'est une question" : ""}</p>`));
    const ligne = h('<div class="ligne" aria-label="Ta phrase"></div>'), tuiles = h('<div class="tuiles"></div>'); zone.append(ligne, tuiles);
    const choisis = [];
    const dessine = () => { ligne.innerHTML = ""; choisis.forEach((i, n) => { const b = h(`<button class="tuile">${esc(mots[i])}</button>`); b.onclick = () => { choisis.splice(n, 1); tuiles.children[ordre.indexOf(i)].disabled = false; dessine() }; ligne.append(b) });
      if (choisis.length === mots.length) verifie() };
    ordre.forEach(i => { const b = h(`<button class="tuile">${esc(mots[i])}</button>`); b.onclick = () => { b.disabled = true; choisis.push(i); dessine() }; tuiles.append(b) });
    function verifie() {
      const essai = choisis.map(i => mots[i]).join(" "), ok = [p.ok, ...(p.alt || [])].some(x => nett(x) === nett(essai));
      if (ok) good++; ligne.classList.add(ok ? "ok" : "bad"); ligne.querySelectorAll("button").forEach(b => b.disabled = true); tuiles.remove();
      zone.append(h(`<div class="fb ${ok ? "" : "bad"}"><b>${ok ? "Bravo !" : "Pas tout à fait."}</b>${ok ? "" : `La bonne phrase : <strong>${esc(p.ok)}</strong> `}${bouton(p.ok)}<br>${esc(p.why)}</div>`));
      k++; nextBtn(zone, next, k === L.length ? "Voir le score" : "Phrase suivante").focus({ preventScroll: true });
    }
  }
}

/* ===== 4. EXERCICES PAR THÈME ===== */
const THEMES_EX = [["matieres", "Matières"], ["fournitures", "Fournitures"], ["lieux", "Lieux"], ["routine", "Routine"], ["ecrire", "Écrire le mot"], ["present", "Présent simple"], ["ordre", "Ordre des mots"], ["pieges", "Pièges"]];
function exercices() { const body = chrome("Exercices par thème"); const zone = h("<div></div>"); tabs(body, THEMES_EX, k => serie(zone, 8, B[k])); body.append(zone) }

/* ===== EXAMEN BLANC ===== */
function examen() { const body = chrome("Examen blanc");
  const g = ["matieres", "matieres", "fournitures", "fournitures", "lieux", "lieux", "routine", "routine", "ecrire", "ecrire", "ecrire", "present", "present", "present", "present", "ordre", "ordre", "ordre", "pieges", "pieges"];
  const list = shuffle(g).map(k => B[k]()); let k = 0, good = 0; const miss = []; const setP = bar(body); const inner = h("<div></div>"); body.append(inner);
  const step = () => { setP(k / 20); window.scrollTo(0, 0);
    if (k === 20) { const best = store.get("best", null); if (best === null || good > best) store.set("best", good); inner.innerHTML = "";
      inner.append(h(`<div class="score"><div class="n">${good}/20</div><p class="prompt">${good >= 18 ? "Excellent, tu es prête pour l'éval !" : good >= 14 ? "Très bien ! Revois les quelques erreurs." : good >= 10 ? "En bonne voie. Relis le cours et les pièges, puis retente." : "Courage : relis le cours et les cartes, puis retente."}</p></div>`));
      if (miss.length) { const r = h('<div class="recap"><p class="prompt">À revoir</p></div>'); miss.forEach(m => r.append(h(`<div class="it"><b>${m.cat}</b>Réponse : ${m.a}</div>`))); inner.append(r) }
      nextBtn(inner, examen, "Refaire un examen"); const hm = h('<button class="ghost-btn">Retour au menu</button>'); hm.onclick = () => location.hash = ""; inner.append(hm); return }
    const q = list[k]; q.run(inner, `Question ${k + 1} sur 20`, (ok, ans) => { if (ok) good++; else miss.push({ cat: q.cat, a: ans }); k++; step() }) }; step() }

/* ===== ACCUEIL ===== */
const ACTS = [
  { id: "cours", ic: "≡", t: "Le cours", d: "Le vocabulaire à écouter, le présent simple, l'ordre des mots, les pièges" },
  { id: "cartes", ic: "?", t: "Les cartes", d: "Du français vers l'anglais : matières, fournitures, lieux, routine" },
  { id: "ranger", ic: "⇄", t: "Remets les mots dans l'ordre", d: "Construire des phrases mot par mot" },
  { id: "exercices", ic: "✓", t: "Exercices par thème", d: "Vocabulaire, écrire le mot, présent simple, ordre des mots…" },
];
function home() { app.innerHTML = ""; const best = store.get("best", null);
  const hero = `<svg viewBox="0 0 300 90" aria-hidden="true">
    <rect x="6" y="18" width="78" height="60" rx="12" fill="var(--blue)" opacity=".85"/><rect x="22" y="8" width="46" height="18" rx="8" fill="none" stroke="var(--blue)" stroke-width="5"/><rect x="18" y="44" width="54" height="14" rx="5" fill="var(--card)" opacity=".7"/>
    <g transform="translate(108 30) rotate(-12)"><rect width="110" height="16" rx="4" fill="var(--hl)"/><path d="M110 0 L132 8 L110 16 Z" fill="var(--ink-soft)"/><rect x="-14" width="16" height="16" rx="4" fill="var(--red)" opacity=".8"/></g>
    <g transform="translate(150 54)"><rect width="140" height="22" rx="3" fill="none" stroke="var(--ink-soft)" stroke-width="3"/>${[1,2,3,4,5,6].map(i => `<line x1="${i * 20}" y1="0" x2="${i * 20}" y2="${i % 2 ? 9 : 13}" stroke="var(--ink-soft)" stroke-width="2"/>`).join("")}</g></svg>`;
  app.append(h(`<header class="hero"><h1>Middle school <span>is cool</span></h1><p class="sub">Anglais, 6e : matières, fournitures, lieux du collège, daily routine · présent simple et ordre des mots</p>${hero}</header>`));
  const ul = h('<ul class="menu"></ul>'); ACTS.forEach(a => { const li = h(`<li><button><span class="ic">${a.ic}</span><span><span class="t">${a.t}</span><span class="d">${a.d}</span></span><span class="chev">›</span></button></li>`); li.firstChild.onclick = () => location.hash = a.id; ul.append(li) }); app.append(ul);
  const ex = h(`<button class="exam-btn"><span class="t">Examen blanc</span><span class="d">20 questions mélangées${best !== null ? ` · meilleur score : ${best}/20` : ""}</span></button>`); ex.onclick = () => location.hash = "examen"; app.append(ex);
  app.append(h(`<p class="foot">Le vocabulaire vient de ton cahier. La grammaire (présent simple, ordre des mots) n'était pas dans les photos : elle a été faite d'après des cours en ligne, compare avec ce que tu as vu en classe.${peutParler ? " Touche 🔊 pour entendre un mot." : ""}</p>`));
  app.append(h(`<p class="foot"><a href="../" style="color:inherit">← Toutes les révisions</a></p>`));
}
const ROUTES = { cours, cartes, ranger, exercices, examen };
function route() { const r = location.hash.slice(1); (ROUTES[r] || home)() }
window.addEventListener("hashchange", route); route();
</script>
