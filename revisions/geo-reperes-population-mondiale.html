<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repères et population mondiale · Révisions 6e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../exercices/moteur.css">
<style>
/* la couleur de l'histoire-géo remplace le bleu du moteur */
:root{--blue:#A63D22}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--blue:#E0754F}}
:root[data-theme="dark"]{--blue:#E0754F}

/* accueil */
.hero{padding:26px 2px 14px}
.hero h1{font-size:clamp(32px,9vw,50px);font-weight:700;letter-spacing:-.01em;line-height:1.1}
.hero h1 span{background:linear-gradient(transparent 62%,var(--hl) 62%,var(--hl) 92%,transparent 92%)}
.hero .sub{color:var(--ink-soft);margin-top:8px}
.hero .gm{margin-top:14px;border-radius:var(--r-md);border:2px solid var(--line)}
.menu{list-style:none;margin:8px 0 0;padding:0;background:var(--card);border-radius:var(--r-lg);border:2px solid var(--line);overflow:hidden}
.menu li+li{border-top:2px solid var(--line)}
.menu button{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;padding:14px;background:none;border:0;text-align:left;cursor:pointer}
.menu .ic{font-family:var(--head);font-weight:700;font-size:18px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--paper);color:var(--blue);border:2px solid var(--line)}
.menu .t{font-family:var(--head);font-weight:600;font-size:19px;display:block}
.menu .d{font-size:14px;color:var(--ink-soft);display:block}
.menu .chev{font-size:22px;color:var(--ink-soft)}
.exam-btn{display:block;width:100%;margin-top:18px;padding:18px 20px;border:0;border-radius:var(--r-lg);background:var(--blue);color:var(--on-ink);text-align:left;cursor:pointer}
.exam-btn .t{font-family:var(--head);font-weight:700;font-size:25px;display:block}
.exam-btn .d{font-size:14px;opacity:.9}
.foot{margin-top:22px;font-size:14px;color:var(--ink-soft)}

/* le cours */
.bloc{background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
.bloc h3{font-family:var(--head);font-weight:600;font-size:20px;margin:0 0 8px;color:var(--blue)}
.bloc p{margin:8px 0}
.bloc ul{margin:8px 0;padding-left:20px}
.bloc li{margin:4px 0}
.complement{font-size:14px;color:var(--ink-soft)}
.piege{border-color:var(--red)} .piege h3{color:var(--red)}
.redac{border-style:dashed}
.redac p{font-size:16px}
.coche li{list-style:none;margin-left:-20px;padding-left:26px;position:relative}
.coche li::before{content:"☐";position:absolute;left:0;color:var(--blue)}
.mots{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mots span{border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:15px;background:var(--paper)}
.tab{width:100%;border-collapse:collapse;background:var(--card);font-size:15px}
.tab th,.tab td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tab th{font-family:var(--head);font-weight:600;font-size:15px;color:var(--ink-soft)}
.tab td+td,.tab th+th{border-left:1px solid var(--line)}
.tabbox{border:2px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:6px}
.titre{margin:4px 0 14px;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.nb{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--hl);color:#1E2740;font-weight:700;font-size:13px}

/* cartes du monde : grandes, on fait défiler de gauche à droite */
.mapbox{overflow-x:auto;border-radius:var(--r-md);border:2px solid var(--line);background:var(--gm-sea);touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.mapbox .gm{min-width:780px;cursor:crosshair}
.mapbox.voir .gm{cursor:default}
.glisse{font-size:13px;color:var(--ink-soft);margin:4px 0 10px}
.legende{display:grid;gap:6px;font-size:14px;margin:10px 0}
.legende span{display:flex;gap:8px;align-items:center}
.legende i{flex:none;display:inline-block;width:22px;height:14px;border-radius:50%}

/* cartes de vocabulaire */
.face{display:block;width:100%;min-height:230px;border-radius:var(--r-lg);padding:26px 20px;text-align:center;border:2px solid var(--line);cursor:pointer}
.face.front{background:var(--card);padding-top:44px}
.face.back{display:none;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fcard.on .front{display:none}.fcard.on .back{display:block}
.face .w{display:block;font-family:var(--head);font-weight:600;font-size:25px;line-height:1.3}
.face .hint{display:block;margin-top:30px;font-size:14px;opacity:.7}
.face .lab{display:block;font-family:var(--head);font-weight:600;font-size:17px;margin-bottom:12px;opacity:.8;text-align:left}
.face .def{display:block;font-size:19px;line-height:1.5;text-align:left}
.face .ex{display:block;font-size:15px;margin-top:12px;opacity:.8;text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two button{padding:14px;border-radius:var(--r-md);border:0;font-family:var(--head);font-weight:600;font-size:19px;cursor:pointer}
.b-bad{background:var(--bad-bg);color:var(--red)} .b-ok{background:var(--ok-bg);color:var(--green)}
.counter{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-soft);margin-bottom:6px}
.recap .it{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.recap .it b{display:block}
.fig .gm{min-width:0}
</style>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icones/icone-180.png">
<meta name="apple-mobile-web-app-title" content="Révisions">
</head>
<body>
<main class="wrap" id="app"></main>
<script src="../exercices/moteur.js"></script>
<script src="../exercices/geo-reperes-population-mondiale.js"></script>
<script>
const { h, esc, shuffle } = Moteur;
const B = Moteur.banques["geo-reperes-population-mondiale"];
const C = B.reperes.carte;
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
const store = { get(k, d) { try { const v = localStorage.getItem("geo6:" + k); return v ? JSON.parse(v) : d } catch (e) { return d } }, set(k, v) { try { localStorage.setItem("geo6:" + k, JSON.stringify(v)) } catch (e) {} } };
const Maj = s => s.charAt(0).toUpperCase() + s.slice(1);

function chrome(title) { app.innerHTML = ""; const top = h(`<div class="top"><button class="back" aria-label="Retour au menu">‹</button><h2>${title}</h2></div>`); top.querySelector(".back").onclick = () => { location.hash = "" }; app.append(top); const body = h("<div></div>"); app.append(body); window.scrollTo(0, 0); return body }
function bar(el) { const b = h('<div class="bar"><i></i></div>'); el.prepend(b); return p => b.firstChild.style.width = (p * 100) + "%" }
function tabs(el, items, onPick) { const t = h(`<div class="tabs">${items.map(([k, l]) => `<button data-k="${k}">${l}</button>`).join("")}</div>`); el.append(t); const set = k => { t.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k)); onPick(k) }; t.querySelectorAll("button").forEach(b => b.onclick = () => set(b.dataset.k)); set(items[0][0]); return t }
function nextBtn(el, onDone, label) { const nx = h(`<button class="main-btn">${label}</button>`); nx.onclick = onDone; el.append(nx); return nx }
function serie(zone, n, gen) {
  zone.innerHTML = ""; let k = 0, good = 0; const setP = bar(zone); const inner = h("<div></div>"); zone.append(inner);
  const step = () => { setP(k / n); window.scrollTo(0, 0);
    if (k === n) { inner.innerHTML = ""; inner.append(h(`<div class="score"><div class="n">${good}/${n}</div><p class="prompt">${good === n ? "Sans faute !" : good >= n * .7 ? "Très bien !" : "Continue, ça rentre !"}</p></div>`)); nextBtn(inner, () => serie(zone, n, gen), "Une autre série"); return }
    gen().run(inner, `Question ${k + 1} sur ${n}`, ok => { if (ok) good++; k++; step() }) }; step();
}
const centre = el => requestAnimationFrame(() => el.querySelectorAll(".mapbox").forEach(b => b.scrollLeft = (b.scrollWidth - b.clientWidth) / 2));
// Une grande carte qu'on fait défiler ; on la place au départ sur l'Europe et l'Afrique
function grandeCarte(el, opts, voir) {
  const box = h(`<div class="mapbox ${voir ? "voir" : ""}">${C.carte(opts)}</div>`); el.append(box);
  el.append(h(`<p class="glisse">↔ Fais glisser la carte pour voir le reste du monde.</p>`));
  centre(el); return box;
}

/* ===== 1. LE COURS ===== */
function cours() {
  const body = chrome("Le cours"); const zone = h("<div></div>");
  tabs(body, [["eval", "L'éval"], ["reperes", "Repères"], ["population", "Population"], ["vide", "Pourquoi vide ?"], ["asie", "Asie de l'Est"], ["rediger", "Rédiger"]], k => {
    zone.innerHTML = ""; zone.append(h(`<div>${COURS[k]()}</div>`)); window.scrollTo(0, 0); centre(zone);
  }); body.append(zone);
}
const mots = l => `<div class="mots">${l.map(x => `<span>${esc(x)}</span>`).join("")}</div>`;
const COURS = {
  eval: () => `
  <p class="muted">Ta fiche de révision, recopiée. Coche dans ta tête ce que tu sais.</p>
  <div class="bloc"><h3>Savoir situer</h3>
  ${mots(["pôle Nord", "pôle Sud", "hémisphère Nord", "hémisphère Sud", "cercle polaire arctique", "tropique du Cancer", "équateur", "tropique du Capricorne", "cercle polaire antarctique"])}
  <p style="margin-top:12px"><b>Les continents</b></p>${mots(["Amérique", "Afrique", "Asie", "Europe", "Océanie", "Antarctique"])}
  <p style="margin-top:12px"><b>Les océans</b></p>${mots(["océan Pacifique", "océan Atlantique", "océan Indien", "océan Glacial Arctique", "océan Glacial Antarctique"])}
  <ul class="coche" style="margin-top:12px"><li>les 3 foyers de population les plus peuplés : <b>Asie de l'Est, Asie du Sud, Europe</b></li>
  <li><b>4 régions</b> très peu peuplées <b>au choix</b> (carte 1)</li><li><b>6 métropoles au choix</b> (carte 1)</li></ul></div>
  <div class="bloc"><h3>Savoir définir</h3>${mots(B.definitions.liste.map(d => d.m.replace(/^(un |une |l'|la |les )/, "")))}</div>
  <div class="bloc"><h3>Savoir faire</h3><ul class="coche">
  <li>repérer sur un planisphère les continents et les océans</li>
  <li>se repérer sur une carte grâce aux points cardinaux (rose des vents)</li>
  <li>expliquer pourquoi certaines régions sont inhabitées</li>
  <li>décrire et expliquer la répartition de la population dans le foyer d'Asie de l'Est</li></ul></div>
  <div class="bloc"><h3>Conseil pour les « au choix »</h3>
  <p>Choisis-les dès maintenant et apprends toujours les mêmes, bien répartis sur la carte :</p>
  <ul><li><b>4 régions</b> : Groenland, Sahara, Amazonie, Australie (une par continent, faciles à placer).</li>
  <li><b>6 métropoles</b> : Tokyo, Shanghai, Mumbai, Paris, New York, São Paulo.</li></ul>
  <p class="complement">Ce choix est une simple idée : prends ceux que tu préfères.</p></div>`,
  reperes: () => `
  <div class="mapbox voir" style="margin-bottom:6px">${C.carte({ lignes: true, noms: ["reperes"] })}</div><p class="glisse">↔ Fais glisser la carte.</p>
  <div class="bloc"><h3>Les lignes imaginaires</h3><ul>
  <li><b>L'équateur</b> fait le tour de la Terre au milieu, à égale distance des deux pôles. Il coupe la Terre en deux <b>hémisphères</b> : l'<b>hémisphère Nord</b> au-dessus, l'<b>hémisphère Sud</b> au-dessous.</li>
  <li>Les <b>parallèles</b> sont des cercles parallèles à l'équateur : ils rapetissent quand on va vers les pôles.</li>
  <li>Du nord au sud : <b>cercle polaire arctique</b>, <b>tropique du Cancer</b>, <b>équateur</b>, <b>tropique du Capricorne</b>, <b>cercle polaire antarctique</b>.</li>
  <li>Moyen de s'en souvenir : <b>C</b>ancer → <b>N</b>ord (en haut), <b>C</b>apricorne → <b>S</b>ud. Arctique = nord, Antarctique = sud (« anti » l'Arctique).</li>
  <li>Le <b>pôle Nord</b> et le <b>pôle Sud</b> sont les deux bouts de l'axe autour duquel la Terre tourne. Sur un planisphère, ils sont étirés : c'est tout le bord du haut et tout le bord du bas.</li></ul></div>
  <div class="bloc"><h3>Les points cardinaux</h3>
  <div class="fig" style="border:0">${B.cardinaux.rose(null)}</div>
  <ul><li>Sur une carte, le <b>nord</b> est en haut, le <b>sud</b> en bas, l'<b>est</b> à droite, l'<b>ouest</b> à gauche (on écrit O, ou W en anglais).</li>
  <li>Entre deux points cardinaux : nord-est (NE), sud-est (SE), sud-ouest (SO), nord-ouest (NO). On dit toujours nord ou sud en premier.</li>
  <li>Exemples : l'Europe est <b>au nord</b> de l'Afrique ; l'Asie est <b>à l'est</b> de l'Europe ; l'Amérique est <b>à l'ouest</b> de l'Europe ; l'Océanie est <b>au sud-est</b> de l'Asie.</li></ul></div>
  <div class="bloc"><h3>Les définitions</h3><ul>${B.definitions.liste.slice(0, 4).map(d => `<li><b>${esc(Maj(d.m))}</b> : ${esc(d.d)}</li>`).join("")}</ul>
  <p class="complement">Ces définitions ne sont pas sur tes feuilles : elles viennent de fiches de révision en ligne (SchoolMouv, Pass Éducation, Kartable, Larousse) qui disent la même chose. Compare avec ton cahier, et c'est ton cahier qui compte.</p></div>`,
  population: () => `
  <div class="mapbox voir" style="margin-bottom:6px">${C.carte({ foyers: true, villes: "num", noms: ["population"] })}</div><p class="glisse">↔ Fais glisser la carte.</p>
  <div class="legende"><span><i style="background:color-mix(in srgb,var(--gm-foyer) 20%,transparent);border:2px solid var(--gm-foyer)"></i>Les grands foyers de population</span>
  <span><i style="border:2px dashed var(--gm-foyer)"></i>Les foyers secondaires</span>
  <span><i class="nb" style="width:18px;height:18px;border-radius:50%"></i>Les 12 plus grandes métropoles du monde</span>
  <span><b style="font-size:12px;letter-spacing:.04em">CANADA</b>&nbsp;Région très peu peuplée ou inhabitée</span></div>
  <div class="bloc"><h3>Une répartition très inégale</h3><ul>
  <li>Plus de <b>8 milliards</b> d'humains vivent sur Terre, mais pas partout de la même façon.</li>
  <li>Les <b>trois grands foyers de population</b> : l'<b>Asie de l'Est</b> (le plus grand), l'<b>Asie du Sud</b> et l'<b>Europe</b>. Ce sont des régions très peuplées depuis très longtemps.</li>
  <li>Il y a aussi des <b>foyers secondaires</b> : le Nord-Est des États-Unis, l'Afrique de l'Ouest, la vallée du Nil, le Sud-Est du Brésil.</li>
  <li>À l'inverse, des régions sont <b>très peu peuplées</b> ou vides : le Groenland, le Canada, la Sibérie, l'Asie centrale, l'Arabie, le Sahara, l'Amazonie, l'Australie.</li>
  <li>Sur la carte, <b>un point représente 500 000 habitants</b> : là où il y a beaucoup de points serrés, la <b>densité</b> est forte.</li>
  <li>Aujourd'hui, plus de la moitié des humains sont des <b>urbains</b> (ils vivent en ville). Les autres sont des <b>ruraux</b> (ils vivent à la campagne).</li></ul></div>
  <div class="tabbox"><table class="tab"><tr><th>N°</th><th>Métropole</th><th>Population (millions)</th></tr>
  ${[["Asie de l'Est", [1, 2]], ["Asie du Sud et du Sud-Est", [3, 4]], ["Afrique", [5, 6]], ["Europe", [7, 8]], ["Amérique du Nord", [9, 10]], ["Amérique du Sud", [11, 12]]].map(([c, ns]) => `<tr><th colspan="3" style="background:var(--paper)">${c}</th></tr>` + ns.map(n => { const v = C.DE("ville").find(t => t.no === n); return `<tr><td><span class="nb">${n}</span></td><td>${esc(v.n)} (${esc(v.pays)})</td><td>${String(v.pop).replace(".", ",")}</td></tr>` }).join("")).join("")}</table></div>
  <p class="titre">Document 2 : 12 grandes agglomérations à travers le monde</p>
  <div class="bloc piege"><h3>Attention : Mexico</h3><p>Le tableau range Mexico (n° 12) dans « Amérique du Sud ». En réalité, le <b>Mexique est en Amérique du Nord</b> (on dit aussi « Amérique latine », car on y parle espagnol). Pour l'éval, retiens surtout où placer le n° 12 sur la carte.</p></div>
  <div class="bloc"><h3>Métropole ou agglomération ?</h3><ul>${B.definitions.liste.slice(4).map(d => `<li><b>${esc(Maj(d.m))}</b> : ${esc(d.d)} <i>${esc(d.ex)}</i></li>`).join("")}</ul>
  <p class="complement">Définitions faites d'après des fiches en ligne (SchoolMouv, Pass Éducation, Kartable, INSEE), pas d'après ta leçon : compare avec ton cahier.</p></div>`,
  vide: () => `
  <div class="bloc"><h3>Pourquoi certaines régions sont presque vides ?</h3>
  <p>À cause des <b>contraintes naturelles</b> : des éléments de la nature qui gênent l'installation des humains.</p></div>
  ${B.contraintes.liste.map(k => `<div class="bloc"><h3>${esc(Maj(k.c))}</h3><p>${esc(k.d)}</p><p><b>Exemples :</b> ${esc(k.x.map(x => x[0]).join(", "))}.</p></div>`).join("")}
  <div class="bloc"><h3>Et là où il y a beaucoup de monde ?</h3><p>Les humains s'installent plutôt dans les <b>plaines</b>, près des <b>côtes</b> et des <b>fleuves</b>, là où le climat est doux, où il y a de l'eau et des sols fertiles pour cultiver.</p>
  <p class="complement">Les contraintes naturelles ne sont pas sur tes feuilles : elles viennent de cours en ligne (SchoolMouv, Kartable, Larousse) qui disent la même chose.</p></div>`,
  asie: () => `
  <div class="bloc"><h3>Le plus grand foyer de population du monde</h3><ul>
  <li>L'Asie de l'Est (la <b>Chine</b>, le <b>Japon</b>, la <b>Corée</b>) compte environ <b>1,6 milliard</b> d'habitants.</li>
  <li>Deux des 12 plus grandes métropoles y sont : <b>Tokyo</b> (n° 1, 37 millions) et <b>Shanghai</b> (n° 2, 25 millions).</li></ul></div>
  <div class="bloc"><h3>Décrire : où vivent les habitants ?</h3><ul>
  <li>La population est <b>très inégalement répartie</b>.</li>
  <li>À l'<b>est</b>, près des <b>côtes</b> et dans les <b>plaines des grands fleuves</b> (le Yangzi et le fleuve Jaune), la densité est <b>très forte</b>. On y trouve les grandes métropoles.</li>
  <li>À l'<b>ouest</b>, la population est <b>très faible</b> : les montagnes du <b>Tibet</b> et le <b>désert de Gobi</b> sont presque vides.</li></ul></div>
  <div class="bloc"><h3>Expliquer : pourquoi ?</h3><ul>
  <li>À l'est, les plaines ont de l'<b>eau</b>, des <b>sols fertiles</b> et un <b>climat doux et pluvieux</b> : on y cultive le <b>riz</b> depuis des milliers d'années, ce qui nourrit beaucoup de monde.</li>
  <li>Sur les côtes, les <b>ports</b> permettent le commerce avec le monde entier : il y a des usines et du travail. Beaucoup de ruraux de l'intérieur viennent y vivre : c'est l'<b>exode rural</b>.</li>
  <li>À l'ouest, les <b>contraintes naturelles</b> sont fortes : la <b>haute montagne</b> et le froid au Tibet, la <b>sécheresse</b> dans le désert de Gobi.</li></ul>
  <p class="complement">Cette partie n'est pas sur tes feuilles : elle vient de cours en ligne (Kartable, SchoolMouv, Larousse). Ton professeur l'a peut-être expliquée avec une autre carte : compare avec ton cahier.</p></div>`,
  rediger: () => `
  <p class="muted">Deux réponses rédigées, pour t'entraîner à l'écrit. Lis-les, puis essaie de les redire avec tes mots.</p>
  <div class="bloc redac"><h3>Explique pourquoi certaines régions sont presque inhabitées.</h3>
  <p>Certaines régions du monde sont presque vides à cause des <b>contraintes naturelles</b>. Dans les régions très <b>froides</b> comme le Groenland ou la Sibérie, le sol est gelé et on ne peut pas cultiver. Dans les <b>déserts</b> comme le Sahara, il ne pleut presque jamais et l'eau manque. En Amazonie, la <b>forêt dense</b>, chaude et humide est difficile à traverser. En <b>haute montagne</b>, il fait froid et les pentes sont raides.</p></div>
  <div class="bloc redac"><h3>Décris et explique la répartition de la population dans le foyer d'Asie de l'Est.</h3>
  <p>L'Asie de l'Est est le <b>plus grand foyer de population</b> du monde. La population y est <b>inégalement répartie</b> : elle est très nombreuse à l'<b>est</b>, sur les <b>côtes</b> et dans les <b>plaines des grands fleuves</b>, où se trouvent de grandes métropoles comme <b>Tokyo</b> et <b>Shanghai</b>. À l'<b>ouest</b>, le Tibet et le désert de Gobi sont presque vides.</p>
  <p>À l'est, les plaines ont de l'eau, des sols fertiles et un climat doux : on y cultive le riz depuis très longtemps. Les côtes attirent aussi les habitants grâce aux ports et au travail, et beaucoup de ruraux y viennent (<b>exode rural</b>). À l'ouest, les <b>contraintes naturelles</b> (la haute montagne, le froid, la sécheresse) gênent l'installation des humains.</p></div>`,
};

/* ===== 2. LA CARTE À REGARDER ===== */
function voirCarte() {
  const body = chrome("La carte"); const zone = h("<div></div>");
  tabs(body, [["reperes", "Lignes et pôles"], ["monde", "Continents et océans"], ["population", "Population"]], k => {
    zone.innerHTML = "";
    grandeCarte(zone, k === "reperes" ? { lignes: true, noms: ["reperes"] } : k === "monde" ? { noms: ["monde"] } : { foyers: true, villes: "num", noms: ["population"] }, true);
    if (k === "population") zone.append(h(`<p class="muted small">Les numéros sont ceux du tableau des 12 métropoles (document 2) : 1 Tokyo, 2 Shanghai, 3 Mumbai, 4 Jakarta, 5 Le Caire, 6 Lagos, 7 Londres, 8 Paris, 9 New York, 10 Los Angeles, 11 São Paulo, 12 Mexico.</p>`));
  }); body.append(zone);
}

/* ===== 3. TOUCHE SUR LA CARTE ===== */
const JEUX = {
  reperes: { t: "Lignes et pôles", noms: () => [...C.DE("ligne"), ...C.DE("pole"), ...C.DE("hemi")].map(t => t.n), opts: {} },
  monde: { t: "Continents et océans", noms: () => [...C.DE("continent"), ...C.DE("ocean")].map(t => t.n), opts: {} },
  population: { t: "Foyers et régions vides", noms: () => [...C.DE("foyer"), ...C.DE("region")].map(t => t.n), opts: {} },
  villes: { t: "Les 12 métropoles", noms: () => C.DE("ville").map(t => t.n), opts: { villes: true } },
};
function toucher() {
  const body = chrome("Touche sur la carte"); const zone = h("<div></div>");
  tabs(body, Object.entries(JEUX).map(([k, j]) => [k, j.t]), k => partie(zone, k)); body.append(zone);
}
function partie(zone, key) {
  const J = JEUX[key]; const liste = shuffle(J.noms()).slice(0, 10); let k = 0, good = 0;
  zone.innerHTML = ""; const setP = bar(zone); const inner = h("<div></div>"); zone.append(inner);
  const step = () => { setP(k / liste.length);
    if (k === liste.length) { inner.innerHTML = ""; inner.append(h(`<div class="score"><div class="n">${good}/${liste.length}</div><p class="prompt">${good === liste.length ? "Sans faute !" : good >= 7 ? "Très bien !" : "Regarde encore la carte, puis recommence."}</p></div>`)); nextBtn(inner, () => partie(zone, key), "Une autre série"); return }
    const nom = liste[k], t = C.L(nom); inner.innerHTML = "";
    inner.append(h(`<p class="muted small">${k + 1} sur ${liste.length}</p>`), h(`<p class="prompt">Touche sur la carte : <span style="color:var(--blue)">${esc(Maj(C.nomCourt(t)))}</span>${t.g === "foyer" ? " (le foyer de population)" : ""}</p>`));
    const box = grandeCarte(inner, J.opts); const svg = $("svg", box), fx = $(".fx", svg); let fini = false;
    svg.addEventListener("click", e => {
      if (fini) return; fini = true;
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      const ok = C.juge(nom, [p.x, p.y]); if (ok) good++;
      const lp = t.lp || [400, t.y]; const ecrit = esc(Maj(C.sansArt(C.nomCourt(t))));
      fx.innerHTML = C.surligne(t, true) + `<circle class="tap" cx="${p.x}" cy="${p.y}" r="7" fill="${ok ? "var(--green)" : "var(--red)"}"/>` +
        `<text class="t big" x="${t.g === "ligne" ? p.x : lp[0]}" y="${(t.g === "ligne" ? t.y - 8 : t.g === "pole" ? (t.lat > 0 ? 26 : 398) : lp[1] - (t.g === "ville" ? 12 : 0)) + 4}">${ecrit}</text>`;
      inner.append(h(`<div class="fb ${ok ? "" : "bad"}"><b>${ok ? "Bravo !" : "Raté."}</b>${ok ? "C'est bien là." : "La bonne réponse est surlignée en orange sur la carte."}</div>`));
      k++; nextBtn(inner, step, k === liste.length ? "Voir mon score" : "Suivant").focus({ preventScroll: true });
    });
  }; step();
}

/* ===== 4. LES MOTS À CONNAÎTRE ===== */
function cartes() {
  const body = chrome("Les mots à connaître"); const D = B.definitions.liste;
  body.append(h(`<p class="muted">Lis le mot, dis sa définition dans ta tête (ou à voix haute), puis retourne la carte.</p>`));
  const zone = h("<div></div>"); body.append(zone); start();
  function start() {
    let queue = shuffle(D.map((c, i) => i)), done = 0; next();
    function next() { zone.innerHTML = "";
      if (!queue.length) { zone.append(h(`<div class="score"><div class="n">✓</div><p class="prompt">Tous les mots sont sus !</p></div>`)); nextBtn(zone, start, "Recommencer"); return }
      const c = D[queue[0]];
      zone.append(h(`<div class="counter"><span>Mot</span><span>${done} / ${D.length} sus</span></div>`));
      const card = h(`<div class="fcard" role="button" tabindex="0" aria-label="Retourner la carte"><div class="face front"><span class="w">${esc(Maj(c.m))}</span><span class="hint">Touche la carte pour voir la définition</span></div><div class="face back"><span class="lab">${esc(Maj(c.m))}</span><span class="def">${esc(c.d)}</span><span class="ex">Exemple : ${esc(c.ex)}</span></div></div>`); zone.append(card);
      const btns = h(`<div class="two" style="visibility:hidden"><button class="b-bad">À revoir</button><button class="b-ok">Je savais</button></div>`); zone.append(btns);
      const flip = () => { card.classList.toggle("on"); btns.style.visibility = "visible" }; card.onclick = flip; card.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip() } };
      btns.children[0].onclick = () => { const x = queue.shift(); queue.splice(Math.min(queue.length, 3), 0, x); next() };
      btns.children[1].onclick = () => { queue.shift(); done++; next() };
    }
  }
}

/* ===== 5. EXERCICES PAR THÈME ===== */
const THEMES = [["reperes", "Lignes et pôles"], ["cardinaux", "Points cardinaux"], ["continentsOceans", "Continents et océans"], ["population", "Population"], ["metropoles", "Métropoles"], ["definitions", "Définitions"], ["contraintes", "Pourquoi vide ?"], ["asieEst", "Asie de l'Est"]];
function exercices() { const body = chrome("Exercices par thème"); const zone = h("<div></div>"); tabs(body, THEMES, k => serie(zone, 8, B[k])); body.append(zone) }

/* ===== EXAMEN BLANC ===== */
function examen() { const body = chrome("Examen blanc");
  const g = ["reperes", "reperes", "reperes", "cardinaux", "cardinaux", "continentsOceans", "continentsOceans", "continentsOceans", "population", "population", "metropoles", "metropoles", "definitions", "definitions", "definitions", "definitions", "contraintes", "contraintes", "asieEst", "asieEst"];
  const list = shuffle(g).map(k => B[k]()); let k = 0, good = 0; const miss = []; const setP = bar(body); const inner = h("<div></div>"); body.append(inner);
  const step = () => { setP(k / 20); window.scrollTo(0, 0);
    if (k === 20) { const best = store.get("best", null); if (best === null || good > best) store.set("best", good); inner.innerHTML = "";
      inner.append(h(`<div class="score"><div class="n">${good}/20</div><p class="prompt">${good >= 18 ? "Excellent, tu es prête pour l'éval !" : good >= 14 ? "Très bien ! Revois les quelques erreurs." : good >= 10 ? "En bonne voie. Relis le cours, puis retente." : "Courage : relis le cours et les cartes, puis retente."}</p></div>`));
      if (miss.length) { const r = h('<div class="recap"><p class="prompt">À revoir</p></div>'); miss.forEach(m => r.append(h(`<div class="it"><b>${m.cat}</b>Réponse : ${m.a}</div>`))); inner.append(r) }
      nextBtn(inner, examen, "Refaire un examen"); const hm = h('<button class="ghost-btn">Retour au menu</button>'); hm.onclick = () => location.hash = ""; inner.append(hm); return }
    const q = list[k]; q.run(inner, `Question ${k + 1} sur 20`, (ok, ans) => { if (ok) good++; else miss.push({ cat: q.cat, a: ans }); k++; step() }) }; step() }

/* ===== ACCUEIL ===== */
const ACTS = [
  { id: "cours", ic: "≡", t: "Le cours", d: "Ce qui est demandé à l'éval, les repères, la population, l'Asie de l'Est" },
  { id: "carte", ic: "◎", t: "La carte", d: "Lignes, continents, océans, foyers, régions vides, métropoles" },

  const ex = h(`<button class="exam-btn"><span class="t">Examen blanc</span><span class="d">20 questions mélangées${best !== null ? ` · meilleur score : ${best}/20` : ""}</span></button>`); ex.onclick = () => location.hash = "examen"; app.append(ex);
  app.append(h(`<p class="foot">Faite avec ta fiche de révision et la carte « La répartition de la population mondiale ». Ta leçon n'était pas fournie : les définitions et les explications viennent de cours en ligne qui disent la même chose. Compare avec ton cahier.</p>`));

}
const ROUTES = { cours, carte: voirCarte, toucher, cartes, exercices, examen };
function route() { const r = location.hash.slice(1); (ROUTES[r] || home)() }
window.addEventListener("hashchange", route); route();
