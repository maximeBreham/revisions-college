<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les débuts de l'humanité · Révisions 6e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../exercices/moteur.css">
<style>
/* la couleur de l'histoire remplace le bleu du moteur */
:root{--blue:#A63D22}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--blue:#E0754F}}
:root[data-theme="dark"]{--blue:#E0754F}

/* accueil */
.hero{padding:26px 2px 14px}
.hero h1{font-size:clamp(34px,10vw,52px);font-weight:700;letter-spacing:-.01em}
.hero h1 span{background:linear-gradient(transparent 62%,var(--hl) 62%,var(--hl) 92%,transparent 92%)}
.hero .sub{color:var(--ink-soft);margin-top:8px}
.hero svg{display:block;width:100%;max-width:420px;height:auto;margin-top:14px}
.menu{list-style:none;margin:8px 0 0;padding:0;background:var(--card);border-radius:var(--r-lg);border:2px solid var(--line);overflow:hidden}
.menu li+li{border-top:2px solid var(--line)}
.menu button{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;padding:14px;background:none;border:0;text-align:left;cursor:pointer}
.menu .ic{font-family:var(--head);font-weight:700;font-size:18px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--paper);color:var(--blue);border:2px solid var(--line)}
.menu .t{font-family:var(--head);font-weight:600;font-size:19px;display:block}
.menu .d{font-size:14px;color:var(--ink-soft);display:block}
.menu .chev{font-size:22px;color:var(--ink-soft)}
.exam-btn{display:block;width:100%;margin-top:18px;padding:18px 20px;border:0;border-radius:var(--r-lg);background:var(--blue);color:var(--on-ink);text-align:left;cursor:pointer}
.exam-btn .t{font-family:var(--head);font-weight:700;font-size:25px;display:block}
.exam-btn .d{font-size:14px;opacity:.9}
.foot{margin-top:22px;font-size:14px;color:var(--ink-soft)}

/* cartes du cours */
.face{display:block;width:100%;min-height:230px;border-radius:var(--r-lg);padding:26px 20px;text-align:center;border:2px solid var(--line);cursor:pointer}
.face.front{background:var(--card);padding-top:56px}
.face.back{display:none;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fcard.on .front{display:none}.fcard.on .back{display:block}
.face .w{display:block;font-family:var(--head);font-weight:700;font-size:26px;line-height:1.25}
.face .hint{display:block;margin-top:34px;font-size:14px;opacity:.7}
.face .lab{display:block;font-family:var(--head);font-weight:600;font-size:19px;margin-bottom:10px;opacity:.85}
.face .def{display:block;font-size:18px;line-height:1.5;text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two button{padding:14px;border-radius:var(--r-md);border:0;font-family:var(--head);font-weight:600;font-size:19px;cursor:pointer}
.b-bad{background:var(--bad-bg);color:var(--red)} .b-ok{background:var(--ok-bg);color:var(--green)}
.pour{display:inline-block;margin-bottom:10px;padding:4px 12px;border-radius:999px;background:var(--hl);color:#1E2740;font-family:var(--head);font-weight:600;font-size:16px}

.counter{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-soft);margin-bottom:6px}

/* frise et trajet, de haut en bas */
.vfrise{list-style:none;margin:6px 0 0;padding:0 0 0 26px;position:relative}
.vfrise::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:4px;border-radius:2px;background:var(--line)}
.vfrise li{position:relative;padding:8px 0 14px}
.vfrise li::before{content:"";position:absolute;left:-23px;top:13px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--blue)}
.vfrise b{font-family:var(--head);font-weight:600;font-size:19px;display:block}
.vfrise span{color:var(--ink-soft);font-size:15px}
.vfrise .sans{font-style:italic}
.periode{margin:4px 0 12px;padding:10px 14px;border-radius:var(--r-md);background:var(--card);border:2px solid var(--line)}
.ordre{display:grid;gap:10px}
.ordre button{padding:13px 15px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--card);font-size:17px;text-align:left;cursor:pointer}
.ordre button.ok{background:var(--ok-bg);border-color:var(--green)} .ordre button.bad{background:var(--bad-bg);border-color:var(--red)}
.ordre button:disabled{cursor:default}
.recap .it{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.recap .it b{display:block}
</style>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icones/icone-180.png">
<meta name="apple-mobile-web-app-title" content="Révisions">
</head>
<body>
<main class="wrap" id="app"></main>
<script src="../exercices/moteur.js"></script>
<script src="../exercices/histoire-debuts-humanite-2.js"></script>
<script>
const { h, esc, shuffle } = Moteur;
const B = Moteur.banques["histoire-debuts-humanite-2"];
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
const store = { get(k, d) { try { const v = localStorage.getItem("rh6b:" + k); return v ? JSON.parse(v) : d } catch (e) { return d } }, set(k, v) { try { localStorage.setItem("rh6b:" + k, JSON.stringify(v)) } catch (e) {} } };

function chrome(title) { app.innerHTML = ""; const top = h(`<div class="top"><button class="back" aria-label="Retour au menu">‹</button><h2>${title}</h2></div>`); top.querySelector(".back").onclick = () => { location.hash = "" }; app.append(top); const body = h("<div></div>"); app.append(body); window.scrollTo(0, 0); return body }
function bar(el) { const b = h('<div class="bar"><i></i></div>'); el.prepend(b); return p => b.firstChild.style.width = (p * 100) + "%" }
function tabs(el, items, onPick) { const t = h(`<div class="tabs">${items.map(([k, l]) => `<button data-k="${k}">${l}</button>`).join("")}</div>`); el.append(t); const set = k => { t.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k)); onPick(k) }; t.querySelectorAll("button").forEach(b => b.onclick = () => set(b.dataset.k)); set(items[0][0]); return t }
function nextBtn(el, onDone, label) { const nx = h(`<button class="main-btn">${label}</button>`); nx.onclick = onDone; el.append(nx); return nx }
function serie(zone, n, gen) {
  zone.innerHTML = ""; let k = 0, good = 0; const setP = bar(zone); const inner = h("<div></div>"); zone.append(inner);
  const step = () => { setP(k / n); window.scrollTo(0, 0);
    if (k === n) { inner.innerHTML = ""; inner.append(h(`<div class="score"><div class="n">${good}/${n}</div><p class="prompt">${good === n ? "Sans faute !" : good >= n * .7 ? "Très bien !" : "Continue, ça rentre !"}</p></div>`)); nextBtn(inner, () => serie(zone, n, gen), "Une autre série"); return }
    gen().run(inner, `Question ${k + 1} sur ${n}`, ok => { if (ok) good++; k++; step() }) }; step();
}
// Liste de haut en bas (frise ou trajet) : [titre, détail]
const vliste = items => `<ol class="vfrise">${items.map(([t, d]) => `<li><b>${esc(t)}</b><span class="${d ? "" : "sans"}">${esc(d || "pas de date sur la frise")}</span></li>`).join("")}</ol>`;
// Jeu : toucher les éléments dans le bon ordre. Une erreur ne bloque pas, elle est comptée.
function ordre(zone, labels, consigne, fin) {
  zone.innerHTML = ""; let k = 0, erreurs = 0;
  zone.append(h(`<p class="prompt">${consigne}</p>`));
  const box = h(`<div class="ordre"></div>`); zone.append(box);
  shuffle(labels.map((l, i) => i)).forEach(i => { const b = h(`<button>${esc(labels[i])}</button>`); box.append(b);
    b.onclick = () => {
      if (i === k) { b.disabled = true; b.classList.add("ok"); b.textContent = `${k + 1}. ${labels[i]}`; k++;
        if (k === labels.length) { zone.append(h(`<div class="score"><div class="n">${erreurs === 0 ? "✓" : erreurs}</div><p class="prompt">${erreurs === 0 ? "Sans erreur !" : erreurs === 1 ? "Une seule erreur." : `${erreurs} erreurs : recommence pour t'entraîner.`}</p></div>`)); fin(); nextBtn(zone, () => ordre(zone, labels, consigne, fin), "Recommencer") } }
      else { erreurs++; b.classList.add("bad"); setTimeout(() => b.classList.remove("bad"), 500) }
    } });
}

/* ===== 1. LE COURS EN CARTES ===== */
function cours() {
  const body = chrome("Le cours en cartes"); const zone = h("<div></div>"); body.append(zone); start();
  function start() {
    const C = B.definir.cartes; let queue = shuffle(C.map((c, i) => i)), done = 0; next();
    function next() { zone.innerHTML = "";
      if (!queue.length) { zone.append(h(`<div class="score"><div class="n">✓</div><p class="prompt">Toutes les cartes sont sues !</p></div>`)); nextBtn(zone, start, "Recommencer"); return }
      const c = C[queue[0]];
      zone.append(h(`<div class="counter"><span>${c[0].endsWith("?") ? "Question" : "Que veut dire…"}</span><span>${done} / ${C.length} sues</span></div>`));
      const card = h(`<div class="fcard" role="button" tabindex="0" aria-label="Retourner la carte"><div class="face front"><span class="w">${esc(c[0])}</span><span class="hint">Touche la carte pour voir la réponse</span></div><div class="face back"><span class="lab">${esc(c[0])}</span><span class="def">${esc(c[1])}</span></div></div>`); zone.append(card);
      const btns = h(`<div class="two" style="visibility:hidden"><button class="b-bad">À revoir</button><button class="b-ok">Je savais</button></div>`); zone.append(btns);
      const flip = () => { card.classList.toggle("on"); btns.style.visibility = "visible" }; card.onclick = flip; card.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip() } };
      btns.children[0].onclick = () => { const x = queue.shift(); queue.splice(Math.min(queue.length, 3), 0, x); next() };
      btns.children[1].onclick = () => { queue.shift(); done++; next() };
    }
  }
}

/* ===== 2. LA FRISE ===== */
function frise() {
  const body = chrome("La frise du Paléolithique"); const zone = h("<div></div>"); const F = B.frise.liste;
  tabs(body, [["voir", "La frise"], ["ordre", "Remettre dans l'ordre"], ["quiz", "Me tester"]], k => {
    zone.innerHTML = "";
    if (k === "quiz") return serie(zone, 8, B.frise);
    if (k === "ordre") return ordre(zone, F.map(f => f.k), "Touche du plus ancien au plus récent.", () => zone.querySelector(".ordre").insertAdjacentHTML("afterend", vliste(F.map(f => [f.k, f.d]))));
    zone.append(h(`<div class="periode"><b>Paléolithique</b> : « âge ancien de la pierre » en grec, l'âge de la pierre taillée. Il va des premiers humains jusqu'à l'apparition de l'agriculture.</div>`));
    zone.append(h(vliste(F.map(f => [f.k, f.d]))));
    zone.append(h(`<p class="muted small">Du plus ancien (en haut) au plus récent (en bas), comme sur la frise de la leçon. Toumaï est notre plus vieil ancêtre connu ; Homo habilis (« l'homme habile ») démarre le genre humain.</p>`));
  }); body.append(zone);
}

/* ===== 3. LE PEUPLEMENT DE LA TERRE ===== */
function peuplement() {
  const body = chrome("Le peuplement de la Terre"); const zone = h("<div></div>"); const P = B.peuplement.liste;
  tabs(body, [["voir", "Le trajet"], ["ordre", "Remettre dans l'ordre"], ["quiz", "Me tester"]], k => {
    zone.innerHTML = "";
    if (k === "quiz") return serie(zone, 8, B.peuplement);
    if (k === "ordre") return ordre(zone, P.map(p => p.k), "Touche les continents dans l'ordre où les humains les ont atteints.", () => {});
    zone.append(h(vliste(P.map(p => [p.k, p.d]))));
    zone.append(h(`<p>Les archéologues pensent que les premiers humains ont quitté l'Afrique il y a environ <b>2 millions d'années</b>. Ce sont les <b>Homo sapiens</b> qui atteignent l'Océanie, puis l'Amérique.</p>`));
  }); body.append(zone);
}

/* ===== 4. EXERCICES PAR THÈME ===== */
const THEMES = [["definir", "Définitions"], ["frise", "Frise"], ["peuplement", "Peuplement"], ["vie", "La vie"], ["connaitre", "À savoir"], ["motJuste", "Mot juste"]];
function exercices() { const body = chrome("Exercices par thème"); const zone = h("<div></div>"); tabs(body, THEMES, k => serie(zone, 8, B[k])); body.append(zone) }

/* ===== EXAMEN BLANC ===== */
function examen() { const body = chrome("Examen blanc");
  const g = ["definir", "definir", "definir", "definir", "frise", "frise", "frise", "frise", "peuplement", "peuplement", "peuplement", "peuplement", "vie", "vie", "vie", "vie", "connaitre", "connaitre", "motJuste", "motJuste"];
  const list = shuffle(g).map(k => B[k]()); let k = 0, good = 0; const miss = []; const setP = bar(body); const inner = h("<div></div>"); body.append(inner);
  const step = () => { setP(k / 20); window.scrollTo(0, 0);
    if (k === 20) { const best = store.get("best", null); if (best === null || good > best) store.set("best", good); inner.innerHTML = "";
      inner.append(h(`<div class="score"><div class="n">${good}/20</div><p class="prompt">${good >= 18 ? "Excellent, tu es prête pour le contrôle !" : good >= 14 ? "Très bien ! Revois les quelques erreurs." : good >= 10 ? "En bonne voie. Refais les cartes du cours, puis retente." : "Courage : relis les cartes du cours, puis retente."}</p></div>`));
      if (miss.length) { const r = h('<div class="recap"><p class="prompt">À revoir</p></div>'); miss.forEach(m => r.append(h(`<div class="it"><b>${m.cat}</b>Réponse : ${m.a}</div>`))); inner.append(r) }
      nextBtn(inner, examen, "Refaire un examen"); const hm = h('<button class="ghost-btn">Retour au menu</button>'); hm.onclick = () => location.hash = ""; inner.append(hm); return }
    const q = list[k]; q.run(inner, `Question ${k + 1} sur 20`, (ok, ans) => { if (ok) good++; else miss.push({ cat: q.cat, a: ans }); k++; step() }) }; step() }

/* ===== ACCUEIL ===== */
const ACTS = [
  { id: "cours", ic: "?", t: "Le cours en cartes", d: "Préhistoire, hominidés, Toumaï, Lucy, Paléolithique…" },
  { id: "frise", ic: "↓", t: "La frise", d: "De Toumaï à l'agriculture, à remettre dans l'ordre" },
  { id: "peuplement", ic: "→", t: "Le peuplement de la Terre", d: "De l'Afrique jusqu'à l'Amérique" },
  { id: "exercices", ic: "✓", t: "Exercices par thème", d: "Frise, peuplement, la vie des premiers humains…" },
];
function home() { app.innerHTML = ""; const best = store.get("best", null);
  const pts = [["Toumaï", 30], ["Lucy", 120], ["habilis", 190], ["erectus", 255], ["sapiens", 360]];
  const hero = `<svg viewBox="0 0 420 70" aria-hidden="true"><line x1="14" y1="24" x2="398" y2="24" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/><path d="M396 14 L412 24 L396 34 Z" fill="var(--line)"/>`
    + pts.map(([t, x], i) => `<circle cx="${x}" cy="24" r="${i ? 8 : 10}" fill="${i === 4 ? "var(--blue)" : "var(--card)"}" stroke="var(--blue)" stroke-width="3"/><text x="${x}" y="58" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="600" font-size="15" fill="var(--ink-soft)">${t}</text>`).join("") + `</svg>`;
  app.append(h(`<header class="hero"><span class="pour">Pour Mimi</span><h1>Les débuts <span>de l'humanité</span></h1><p class="sub">Histoire, 6e : où et quand les premiers humains sont-ils apparus ? Comment ont-ils peuplé la Terre ?</p>${hero}</header>`));
  const ul = h('<ul class="menu"></ul>'); ACTS.forEach(a => { const li = h(`<li><button><span class="ic">${a.ic}</span><span><span class="t">${a.t}</span><span class="d">${a.d}</span></span><span class="chev">›</span></button></li>`); li.firstChild.onclick = () => location.hash = a.id; ul.append(li) }); app.append(ul);
  const ex = h(`<button class="exam-btn"><span class="t">Examen blanc</span><span class="d">20 questions mélangées${best !== null ? ` · meilleur score : ${best}/20` : ""}</span></button>`); ex.onclick = () => location.hash = "examen"; app.append(ex);
  app.append(h(`<p class="foot">Tout vient de la leçon recopiée dans le cahier, avec ses dates. Compare avec ta propre leçon : si ton professeur donne d'autres dates, garde les siennes.</p>`));
  app.append(h(`<p class="foot"><a href="../" style="color:inherit">← Toutes les révisions</a></p>`));
}
const ROUTES = { cours, frise, peuplement, exercices, examen };
function route() { const r = location.hash.slice(1); (ROUTES[r] || home)() }
window.addEventListener("hashchange", route); route();
</script>
</body>
</html>
