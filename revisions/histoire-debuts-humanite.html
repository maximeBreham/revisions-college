<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les débuts de l'humanité · Révisions 6e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#E9DEC8; --wall-2:#DDCFB4; --card:#F6EFE2; --ink:#2B211B; --ink-soft:#5E5045;
  --ochre:#A63D22; --ochre-y:#C98A1E; --manganese:#3B312B; --ok:#3E7A3B; --ok-bg:#DCEBD3;
  --bad:#B3321F; --bad-bg:#F5D6CC; --line:#CDBD9F; --sea:#BFD3D6; --land:#E2CFA4; --land-stroke:#B9A276;
  --river:#2F6F96; --on-dark:#F6EFE2;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --head:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#1E1713; --wall-2:#2A201A; --card:#2E241D; --ink:#F1E6D3; --ink-soft:#BFAF9A;
    --ochre:#E0754F; --ochre-y:#E3A940; --manganese:#F1E6D3; --ok:#8BC57F; --ok-bg:#24391F;
    --bad:#F08A6E; --bad-bg:#4A2219; --line:#4A3B30; --sea:#1F3A44; --land:#5A4A33; --land-stroke:#7C6747;
    --river:#7FC0E6; --on-dark:#1E1713; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --wall:#1E1713; --wall-2:#2A201A; --card:#2E241D; --ink:#F1E6D3; --ink-soft:#BFAF9A;
    --ochre:#E0754F; --ochre-y:#E3A940; --manganese:#F1E6D3; --ok:#8BC57F; --ok-bg:#24391F;
    --bad:#F08A6E; --bad-bg:#4A2219; --line:#4A3B30; --sea:#1F3A44; --land:#5A4A33; --land-stroke:#7C6747;
    --river:#7FC0E6; --on-dark:#1E1713; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--wall);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--ochre-y);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
p{margin:.4em 0}
.muted{color:var(--ink-soft)}
.small{font-size:15px}

/* HOME */
.hero{position:relative;padding:28px 4px 18px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px}
.hero h1{font-size:clamp(38px,11vw,58px);font-weight:700;letter-spacing:-.01em}
.hero .sub{font-size:17px;color:var(--ink-soft);margin-top:8px}
.hand{width:118px;height:132px;margin-right:-6px;transform:rotate(-8deg)}
.menu{list-style:none;margin:10px 0 0;padding:0;border-top:2px solid var(--line)}
.menu li{border-bottom:2px solid var(--line)}
.menu button{display:grid;grid-template-columns:22px 1fr auto;gap:14px;align-items:center;width:100%;padding:16px 4px;background:none;border:0;text-align:left;cursor:pointer}
.menu .dot{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--c) 70%,#000 30%)}
.menu .t{font-family:var(--head);font-weight:600;font-size:21px;display:block}
.menu .d{font-size:15px;color:var(--ink-soft);display:block}
.menu .chev{font-size:24px;color:var(--ink-soft)}
.exam-btn{display:block;width:100%;margin-top:22px;padding:20px;border:0;border-radius:var(--r-lg);background:var(--manganese);color:var(--on-dark);text-align:left;cursor:pointer}
.exam-btn .t{font-family:var(--head);font-weight:700;font-size:26px;display:block}
.exam-btn .d{font-size:15px;opacity:.85}
.foot{margin-top:26px;font-size:14px;color:var(--ink-soft)}

/* ACTIVITY CHROME */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--wall);display:flex;align-items:center;gap:10px;padding:10px 0;margin:-16px 0 8px}
.back{border:0;background:var(--wall-2);border-radius:999px;width:44px;height:44px;font-size:22px;cursor:pointer;flex:none}
.top h2{font-size:22px;font-weight:600}
.bar{height:8px;background:var(--wall-2);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--ochre-y);width:0;transition:width .3s}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.tabs button{border:2px solid var(--line);background:none;border-radius:999px;padding:7px 14px;font-size:16px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.prompt{font-family:var(--head);font-weight:600;font-size:23px;line-height:1.25;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;background:var(--card);border:2px solid var(--line);border-radius:var(--r-md);cursor:pointer;font-size:17px;min-height:54px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:14px 16px;border-radius:var(--r-md);border-left:6px solid var(--ok);background:var(--card)}
.fb.bad{border-left-color:var(--bad)}
.fb b{font-family:var(--head);font-size:19px;display:block;margin-bottom:2px}
.main-btn{display:block;width:100%;margin-top:16px;padding:15px;border:0;border-radius:var(--r-md);background:var(--ink);color:var(--wall);font-family:var(--head);font-weight:600;font-size:20px;cursor:pointer}
.main-btn:disabled{opacity:.35;cursor:default}
.ghost-btn{display:block;width:100%;margin-top:10px;padding:13px;border:2px solid var(--line);border-radius:var(--r-md);background:none;font-size:17px;cursor:pointer}
.score{text-align:center;padding:22px 0 6px}
.score .n{font-family:var(--head);font-weight:700;font-size:72px;line-height:1}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* FLASHCARDS */
.flip{margin:6px 0 4px}
.fcard{cursor:pointer;display:block;width:100%}
.face{display:block;width:100%;min-height:240px;border-radius:var(--r-lg);padding:28px 20px;text-align:center;border:2px solid var(--line);overflow:visible;height:auto}
.face.front{background:var(--card);padding-top:70px}
.face.back{display:none;background:var(--manganese);color:var(--on-dark);border-color:var(--manganese)}
.fcard.on .front{display:none}
.fcard.on .back{display:block}
.face .w{display:block;font-family:var(--head);font-weight:700;font-size:30px;line-height:1.2;overflow-wrap:break-word}
.face .hint{display:block;margin-top:40px;font-size:14px;opacity:.7}
.face .lab{display:block;font-family:var(--head);font-weight:600;font-size:20px;margin-bottom:12px;opacity:.85}
.face.back .def{display:block;font-size:19px;line-height:1.5;text-align:left;overflow-wrap:break-word;white-space:normal}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two button{padding:15px;border-radius:var(--r-md);border:0;font-family:var(--head);font-weight:600;font-size:19px;cursor:pointer}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.counter{display:flex;justify-content:space-between;font-size:15px;color:var(--ink-soft)}

/* FRISE */
.frise{position:relative;margin:8px 0 0 6px;padding-left:0}
.per{position:relative;margin-left:0;padding:10px 12px 10px 18px;border-left:10px solid var(--c);}
.per h3{font-size:20px;font-weight:600}
.per .span{font-size:14px;color:var(--ink-soft)}
.ev{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:8px;font-size:16px}
.ev .dt{font-family:var(--head);font-weight:600;white-space:nowrap;min-width:92px}
.cut{font-size:13px;color:var(--ink-soft);padding:4px 0 4px 28px;font-style:italic}
.order-list{display:grid;gap:8px;min-height:20px;margin-bottom:12px}
.placed{padding:10px 14px;border-radius:var(--r-sm);background:var(--ok-bg);border:2px solid var(--ok);font-size:16px;display:flex;justify-content:space-between;gap:10px}
.placed span:last-child{font-family:var(--head);font-weight:600;white-space:nowrap}

/* MAP */
.mapbox{overflow-x:auto;border-radius:var(--r-md);border:2px solid var(--line);background:var(--sea);touch-action:pan-x pan-y}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox.world svg{min-width:620px}
.land{fill:var(--land);stroke:var(--land-stroke);stroke-width:.6}
.grat{fill:none;stroke:var(--ink);stroke-opacity:.08;stroke-width:.6}
.riv{fill:none;stroke:var(--river);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-family:var(--body);font-size:13px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--wall);stroke-width:3.5px;text-anchor:middle}
.lbl.big{font-size:15px}
.hl-c{fill:var(--ochre-y);fill-opacity:.35;stroke:var(--ochre-y);stroke-width:3}
.hl-l{fill:none;stroke:var(--ochre-y);stroke-width:9;stroke-opacity:.75;stroke-linecap:round}
.band{fill:none;stroke:var(--ok);stroke-opacity:.35;stroke-width:28;stroke-linecap:round;stroke-linejoin:round}
.tapdot{stroke:var(--wall);stroke-width:3}
.pulse{animation:pulse 1.2s ease-out 2}
@keyframes pulse{0%{opacity:.2}50%{opacity:1}100%{opacity:.6}}
.toggle{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:16px}

/* SIECLES */
.bigdate{font-family:var(--head);font-weight:700;font-size:54px;text-align:center;margin:10px 0 2px}
.entry{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
.slot{min-width:150px;min-height:62px;padding:6px 14px;border-bottom:4px solid var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:42px;text-align:center;letter-spacing:.06em}
.slot.empty{color:var(--ink-soft);font-size:18px;font-family:var(--body);letter-spacing:0;display:flex;align-items:center;justify-content:center}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.keys button{padding:14px 0;border-radius:var(--r-sm);border:2px solid var(--line);background:var(--card);font-family:Georgia,serif;font-size:26px;cursor:pointer}
.keys button.fn{font-family:var(--body);font-size:18px}
.era{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.era button{padding:12px;border-radius:var(--r-sm);border:2px solid var(--line);background:var(--card);font-size:17px;cursor:pointer}
.era button[aria-pressed="true"]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
details.aide{margin-top:16px;background:var(--card);border-radius:var(--r-md);padding:10px 14px;border:2px solid var(--line)}
details.aide summary{cursor:pointer;font-weight:700}
.rom{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:15px;margin-top:8px}
.streak{text-align:center;font-size:15px;color:var(--ink-soft)}

/* REDACTION */
textarea{width:100%;min-height:200px;padding:14px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px;resize:vertical}
.model{background:var(--card);border-radius:var(--r-md);padding:14px 16px;border-left:6px solid var(--ochre-y);margin-top:12px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px;cursor:pointer}
.check input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--ok)}
.recap{margin-top:14px}
.recap .it{padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.recap .it b{display:block}
</style>

/* QCM générique */
function qcm(el,{prompt,options,correct,explain,onDone,sub}){
  const order=shuffle(options.map((o,i)=>i));
  el.innerHTML='';
  if(sub) el.append(h(`<p class="muted small">${sub}</p>`));
  el.append(h(`<p class="prompt">${prompt}</p>`));
  const box=h('<div class="opts"></div>');el.append(box);
  order.forEach(i=>{
    const b=h(`<button class="opt">${esc(options[i])}</button>`);
    b.onclick=()=>{
      const ok=i===correct;
      box.querySelectorAll('button').forEach(x=>x.disabled=true);
      b.classList.add(ok?'ok':'bad');
      if(!ok) box.children[order.indexOf(correct)].classList.add('ok');
      el.append(h(`<div class="fb ${ok?'':'bad'}"><b>${ok?'Bravo !':'Pas tout à fait.'}</b>${ok?'':`La bonne réponse : <strong>${esc(options[correct])}</strong>. `}${explain||''}</div>`));
      const nx=h('<button class="main-btn">Question suivante</button>');nx.onclick=()=>onDone(ok,options[correct]);el.append(nx);nx.focus({preventScroll:true});
    };
    box.append(b);
  });
}
function bar(el){const b=h('<div class="bar"><i></i></div>');el.prepend(b);return p=>b.firstChild.style.width=(p*100)+'%'}

function cardsData(){
  return [
   ...DEFS.map(([w,d])=>({id:'def:'+w,deck:'def',front:w,back:d,ask:'Que veut dire…'})),
   ...DATES.map(x=>({id:'date:'+x.k,deck:'date',front:x.k,back:x.d,ask:'Quand ?'})),
   ...SPANS.map(x=>({id:'span:'+x.k,deck:'date',front:x.k,back:x.d,ask:'De quand à quand ?'})),
  ];
}
function cartes(){
  const body=chrome('Les cartes à retourner');
  const all=cardsData();
  let deck='def';
  const tabs=h(`<div class="tabs"><button data-d="def">Définitions</button><button data-d="date">Dates</button><button data-d="review">Celles à revoir</button></div>`);
  body.append(tabs);
  const zone=h('<div></div>');body.append(zone);
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{deck=b.dataset.d;start()});
  function start(){
    tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===deck));
    const mast=store.get('mastered',{});
    let pool=deck==='review'?all.filter(c=>!mast[c.id]):all.filter(c=>c.deck===deck);
    if(!pool.length){zone.innerHTML='';zone.append(h(`<div class="fb"><b>Tout est su !</b>Toutes les cartes sont marquées comme sues. Tu peux refaire les définitions ou les dates pour vérifier.</div>`));return}
    let queue=shuffle(pool), done=0; const total=pool.length;
    next();
    function next(){
      zone.innerHTML='';
      if(!queue.length){
        zone.append(h(`<div class="score"><div class="n">✓</div><p class="prompt">Série terminée !</p><p class="muted">Toutes les cartes de la série ont été sues au moins une fois.</p></div>`));
        const again=h('<button class="main-btn">Recommencer</button>');again.onclick=start;zone.append(again);return;
      }
      const c=queue[0];
      zone.append(h(`<div class="counter"><span>${c.ask}</span><span>${done} / ${total} sues</span></div>`));
      const fl=h(`<div class="flip"><div class="fcard" role="button" tabindex="0" aria-label="Retourner la carte"><div class="face front"><div class="w">${esc(c.front)}</div><div class="hint">Touche la carte pour la retourner</div></div><div class="face back"><span class="lab">${esc(c.front)}</span><span class="def">${esc(c.back)}</span></div></div></div>`);
      zone.append(fl);
      const card=$('.fcard',fl);
      const btns=h(`<div class="two" style="visibility:hidden"><button class="b-bad">À revoir</button><button class="b-ok">Je savais</button></div>`);
      zone.append(btns);
      const flip=()=>{card.classList.toggle('on');btns.style.visibility='visible'};
      card.onclick=flip;card.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};
      btns.children[0].onclick=()=>{
        queue.shift();const pos=Math.min(queue.length,3);queue.splice(pos,0,c);
        const m=store.get('mastered',{});delete m[c.id];store.set('mastered',m);next();
      };
      btns.children[1].onclick=()=>{
        queue.shift();done++;const m=store.get('mastered',{});m[c.id]=1;store.set('mastered',m);next();
      };
    }
  }
  start();
}

  const tabs=h(`<div class="tabs"><button data-m="voir">Revoir</button><button data-m="ordre">Remettre dans l'ordre</button><button data-m="periode">Quelle période ?</button><button data-m="date">Quelle date ?</button></div>`);
  body.append(tabs);const zone=h('<div></div>');body.append(zone);
  let mode='voir';
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;go()});
  function go(){
    tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
    zone.innerHTML='';
    if(mode==='voir') friseView(zone);
    if(mode==='ordre') ordre(zone);
    if(mode==='periode') serie(zone,10,periodeQ);
    if(mode==='date') serie(zone,10,dateQ);
  }
  go();
}
function ordre(zone){
  const evs=pick(DATES,5); const sorted=[...evs].sort((a,b)=>a.v-b.v); let i=0, errors=0;
  zone.append(h(`<p class="prompt">Touche les événements du plus ancien au plus récent.</p>`));
  const placed=h('<div class="order-list"></div>');zone.append(placed);
  const box=h('<div class="opts"></div>');zone.append(box);
  shuffle(evs).forEach(e=>{
    const b=h(`<button class="opt">${esc(e.k)}</button>`);
    b.onclick=()=>{
      if(e===sorted[i]){b.remove();placed.append(h(`<div class="placed"><span>${esc(e.k)}</span><span>${esc(e.d.replace('vers ',''))}</span></div>`));i++;
        if(i===sorted.length){zone.append(h(`<div class="fb ${errors?'bad':''}"><b>${errors?'Terminé !':'Parfait, sans erreur !'}</b>${errors?`${errors} erreur${errors>1?'s':''} en route. Regarde bien les dates ci-dessus.`:'Tu maîtrises cette partie de la frise.'}</div>`));
          const a=h('<button class="main-btn">Une autre série</button>');a.onclick=()=>{zone.innerHTML='';ordre(zone)};zone.append(a)}
      } else {errors++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake','bad');setTimeout(()=>b.classList.remove('bad'),600)}
    };
    box.append(b);
  });
}
function periodeQ(){
  const [ev,per]=PERIOD_EVENTS[Math.floor(Math.random()*PERIOD_EVENTS.length)];
  if(Math.random()<.3){
    const ans=per==='Antiquité'?'Histoire':'Préhistoire';
    return {prompt:`« ${ev} » : Préhistoire ou Histoire ?`,options:['Préhistoire','Histoire'],correct:ans==='Préhistoire'?0:1,explain:ans==='Histoire'?'L\'Histoire commence avec l\'écriture, vers -3300.':'Avant l\'invention de l\'écriture (vers -3300), c\'est la Préhistoire.'};
  }
  const opts=['Paléolithique','Néolithique','Antiquité'];
  const ex={Paléolithique:'Paléolithique : de -3 millions d\'années à -10 000 ans.',Néolithique:'Néolithique : de -10 000 à -3300, quand apparaissent l\'agriculture et l\'élevage.',Antiquité:'Antiquité : de l\'écriture (vers -3300) jusqu\'en 476.'};
  return {prompt:`« ${ev} » : à quelle période ?`,options:opts,correct:opts.indexOf(per),explain:ex[per]};
}
function dateQ(){
  const pool=[...DATES,...SPANS.map(s=>({k:s.k,d:s.d}))];
  const x=pool[Math.floor(Math.random()*pool.length)];
  const same=pool.filter(y=>y!==x && (!!x.v===!!y.v));
  const wrong=pick(same,3).map(y=>y.d);
  return {prompt:x.v!==undefined?`Quand date : ${x.k} ?`:`De quand à quand va : ${x.k} ?`,options:[x.d,...wrong],correct:0,explain:''};
}
function serie(zone,n,gen,title){
  let k=0,good=0;const setP=bar(zone);const inner=h('<div></div>');zone.append(inner);
  const step=()=>{
    setP(k/n);
    if(k===n){inner.innerHTML='';inner.append(h(`<div class="score"><div class="n">${good}/${n}</div><p class="prompt">${good===n?'Sans faute !':good>=n*.7?'Très bien !':'Continue, ça rentre !'}</p></div>`));
      const a=h('<button class="main-btn">Une autre série</button>');a.onclick=()=>{zone.innerHTML='';serie(zone,n,gen)};inner.append(a);return}
    const q=gen();qcm(inner,{...q,sub:`Question ${k+1} sur ${n}`,onDone:ok=>{if(ok)good++;k++;step();window.scrollTo(0,0)}});
  };step();
}

/* ---------- 3. CARTE ---------- */
const GROUP_LABEL={ocean:'océan',continent:'continent',foyer:'foyer du Néolithique',mer:'mer',fleuve:'fleuve',region:'région',lieu:'lieu'};
function mapSVG(key,{labels=false}={}){
  const M=MAPS[key];
  let s=`<svg viewBox="0 0 ${M.w} ${M.h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carte">`;
  if(M.sphere) s+=`<path d="${M.sphere}" fill="var(--sea)"/>`; else s+=`<rect width="${M.w}" height="${M.h}" fill="var(--sea)"/>`;
  s+=`<path class="grat" d="${M.grat}"/><path class="land" d="${M.land}"/>`;
  for(const [n,t] of Object.entries(M.targets)) if(t.line&&!t.band) s+=`<polyline class="riv" points="${t.line.join(' ')}"/>`;
  if(labels){
    for(const [n,t] of Object.entries(M.targets)) if(t.band) s+=`<polyline class="band" points="${t.line.join(' ')}"/>`;
    for(const [n,t] of Object.entries(M.targets)){
      if(t.g==='foyer'||t.g==='lieu') s+=`<circle cx="${t.lbl[0]}" cy="${t.lbl[1]}" r="5" fill="var(--ochre)"/>`;
      const name=n.replace(/^(l'|le |la |les )/,'').replace(/^(océan|mer) /,'');
      s+=`<text class="lbl ${t.g==='ocean'||t.g==='continent'?'big':''}" x="${t.lbl[0]}" y="${t.lbl[1]-(t.g==='foyer'||t.g==='lieu'?9:0)}">${esc(cap(n.replace(/^(l'|le |la |les )/,'')))}</text>`;
    }
  }
  s+='<g class="fx"></g></svg>';return s;
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function distSeg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];const L=dx*dx+dy*dy;let t=L?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function distT(p,t){if(t.line){let d=1e9;for(let i=0;i<t.line.length-1;i++)d=Math.min(d,distSeg(p,t.line[i],t.line[i+1]));return d}return Math.min(...t.pts.map(q=>Math.hypot(p[0]-q[0],p[1]-q[1])))}
function judge(key,name,p){
  const M=MAPS[key],t=M.targets[name];const d=distT(p,t)/t.r;
  if(t.band||t.g==='lieu') return d<1.3;
  let best=null,bd=1e9;
  for(const [n,u] of Object.entries(M.targets)){ if(u.g!==t.g) continue; const du=distT(p,u)/u.r; if(du<bd){bd=du;best=n} }
  return best===name && d<1.6;
}
function mapQ(el,{key,name,onDone,sub}){
  el.innerHTML='';
  if(sub) el.append(h(`<p class="muted small">${sub}</p>`));
  const t=MAPS[key].targets[name];
  el.append(h(`<p class="prompt">Touche sur la carte : <span style="color:var(--ochre)">${esc(name)}</span></p>`));
  const box=h(`<div class="mapbox ${key==='world'?'world':''}">${mapSVG(key)}</div>`);el.append(box);
  if(key==='world') box.scrollLeft=0;
  const svg=$('svg',box),fx=$('.fx',svg);let doneFlag=false;
  svg.addEventListener('click',e=>{
    if(doneFlag) return;doneFlag=true;
    const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
    const p=[q.x,q.y];const ok=judge(key,name,p);
    let fxs='';
    if(t.line) fxs+=`<polyline class="hl-l pulse" points="${t.line.join(' ')}"/>`;
    else t.pts.forEach(c=>fxs+=`<circle class="hl-c pulse" cx="${c[0]}" cy="${c[1]}" r="${Math.max(14,t.r*.7)}"/>`);
    fxs+=`<circle class="tapdot" cx="${p[0]}" cy="${p[1]}" r="8" fill="${ok?'var(--ok)':'var(--bad)'}"/>`;
    fxs+=`<text class="lbl big" x="${t.lbl[0]}" y="${t.lbl[1]+5}">${esc(cap(name.replace(/^(l'|le |la |les )/,'')))}</text>`;
    fx.innerHTML=fxs;
    el.append(h(`<div class="fb ${ok?'':'bad'}"><b>${ok?'Bravo !':'Raté.'}</b>${ok?'C\'est bien là.':'La bonne zone est surlignée en jaune sur la carte.'}</div>`));
    const nx=h('<button class="main-btn">Question suivante</button>');nx.onclick=()=>onDone(ok,name);el.append(nx);
  });
}
function carte(){
  const body=chrome('La carte');
  let key='world', mode='voir';
  const tabs=h(`<div class="tabs"><button data-k="world">Le monde</button><button data-k="region">Méditerranée et Proche-Orient</button></div>`);
  const modes=h(`<div class="tabs"><button data-m="voir">Apprendre (avec les noms)</button><button data-m="test">Me tester</button></div>`);
  body.append(tabs,modes);const zone=h('<div></div>');body.append(zone);
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{key=b.dataset.k;go()});
  modes.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;go()});
  function go(){
    tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===key));
    modes.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
    zone.innerHTML='';
    if(mode==='voir'){
      zone.append(h(`<div class="mapbox ${key==='world'?'world':''}">${mapSVG(key,{labels:true})}</div>`));
      zone.append(h(`<p class="muted small" style="margin-top:10px">${key==='world'?'Les points rouges sont les grands foyers du Néolithique : là où l\'agriculture est apparue. Sur téléphone, fais glisser la carte de côté pour voir tout le monde.':'La bande verte est le Croissant fertile, entre le Tigre et l\'Euphrate. Le point rouge en France, c\'est Lascaux (Dordogne).'}</p>`));
      return;
    }
    const names=Object.keys(MAPS[key].targets);let list=shuffle(names).slice(0,10),k=0,good=0;
    const setP=bar(zone);const inner=h('<div></div>');zone.append(inner);
    const step=()=>{setP(k/list.length);
      if(k===list.length){inner.innerHTML='';inner.append(h(`<div class="score"><div class="n">${good}/${list.length}</div><p class="prompt">${good===list.length?'Sans faute !':'Continue, ça rentre !'}</p></div>`));const a=h('<button class="main-btn">Une autre série</button>');a.onclick=go;inner.append(a);return}
      mapQ(inner,{key,name:list[k],sub:`Question ${k+1} sur ${list.length}`,onDone:ok=>{if(ok)good++;k++;step()}});
    };step();
  }
  go();
}

/* ---------- 4. SIÈCLES ---------- */
function randYear(){
  const r=Math.random();
  if(r<.15){const c=1+Math.floor(Math.random()*20);return Math.random()<.7?c*100:-c*100}
  if(r<.4) return -(1+Math.floor(Math.random()*3299));
  return 1+Math.floor(Math.random()*2025);
}
function explainCentury(y){
  const a=Math.abs(y),c=centuryOf(y),era=y<0?' av. J.-C.':'';
  if(a%100===0) return `${a} se termine par 00 : c'est la <b>dernière année</b> du ${toRoman(c)}e siècle${era}. Pas besoin d'ajouter 1 (${a/100} → ${toRoman(c)}e).`;
  if(a<100) return `${a} est entre 1 et 100${era} : c'est le <b>Ier siècle${era}</b>.`;
  const cent=Math.floor(a/100);
  return `Dans ${a}, il y a <b>${cent}</b> centaine${cent>1?'s':''}. On ajoute 1 : ${cent} + 1 = <b>${c}</b> → ${toRoman(c)}e siècle${era}.`;
}
function siecles(){
  const body=chrome('Les siècles');
  let streak=0,best=store.get('streak',0);
  const zone=h('<div></div>');body.append(zone);
  body.append(h(`<details class="aide"><summary>Rappel : la méthode et les chiffres romains</summary>
   <p>Pour trouver le siècle : on prend le nombre de centaines et on ajoute 1. Exemple : 1515 → 15 + 1 = 16 → XVIe siècle. Attention : si l'année se termine par 00, on n'ajoute rien (1800 → XVIIIe siècle). Avant J.-C., c'est pareil : -450 → Ve siècle av. J.-C.</p>
   <div class="rom"><span>I = 1</span><span>V = 5</span><span>X = 10</span><span>L = 50</span></div>
   <p class="small">On n'écrit jamais 4 fois le même signe : 4 = IV, 9 = IX, 14 = XIV, 19 = XIX, 40 = XL.</p></details>`));
  next();
  function next(){
    const y=randYear();let val='',era=null;
    zone.innerHTML='';
    zone.append(h(`<p class="streak">Série en cours : ${streak} · record : ${best}</p>`));
    zone.append(h(`<div class="bigdate">${y<0?(-y)+'<span style="font-size:.45em"> av. J.-C.</span>':y}</div>`));
    zone.append(h(`<p class="muted small" style="text-align:center">En quel siècle ? Écris-le en chiffres romains.</p>`));
    const slot=h(`<div class="entry"><div class="slot empty">Tape le siècle</div><div style="font-size:22px">e siècle</div></div>`);zone.append(slot);
    const s=slot.firstChild;
    const render=()=>{s.className='slot'+(val?'':' empty');s.textContent=val||'Tape le siècle'};
    const keys=h(`<div class="keys">${['I','V','X','L','C'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>`);
    const keys2=h(`<div class="two" style="margin-top:8px"><button class="ghost-btn" style="margin:0">Effacer</button><button class="ghost-btn" style="margin:0">Tout effacer</button></div>`);
    zone.append(keys,keys2);
    keys.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(val.length<8){val+=b.dataset.k;render();upd()}});
    keys2.children[0].onclick=()=>{val=val.slice(0,-1);render();upd()};
    keys2.children[1].onclick=()=>{val='';render();upd()};
    const eraB=h(`<div class="era"><button data-e="ap">Après J.-C.</button><button data-e="av">Avant J.-C.</button></div>`);zone.append(eraB);
    eraB.querySelectorAll('button').forEach(b=>b.onclick=()=>{era=b.dataset.e;eraB.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));upd()});
    const ok=h('<button class="main-btn" disabled>Vérifier</button>');zone.append(ok);
    function upd(){ok.disabled=!(val&&era)}
    ok.onclick=()=>{
      const c=centuryOf(y),good=toRoman(c),goodEra=y<0?'av':'ap';
      const right=val===good&&era===goodEra;
      [keys,keys2,eraB].forEach(g=>g.querySelectorAll('button').forEach(b=>b.disabled=true));ok.remove();
      if(right){streak++;if(streak>best){best=streak;store.set('streak',best)}}else streak=0;
      let msg=explainCentury(y);
      if(!right&&val===good&&era!==goodEra) msg=`Le chiffre est bon, mais ${y<0?'cette date est <b>avant</b> J.-C.':'cette date est <b>après</b> J.-C.'} ` + msg;
      else if(!right&&val!==good&&/^[IVXLC]+$/.test(val)) msg+=` Tu as écrit ${val}, la bonne écriture est <b>${good}</b>.`;
      zone.append(h(`<div class="fb ${right?'':'bad'}"><b>${right?'Exact : '+good+'e siècle'+(y<0?' av. J.-C.':'')+' !':'Réponse : '+good+'e siècle'+(y<0?' av. J.-C.':'')}</b>${msg}</div>`));
      const nx=h('<button class="main-btn">Date suivante</button>');nx.onclick=next;zone.append(nx);
    };
  }
}

/* ---------- 5. CONNAÎTRE ---------- */

  const body=chrome('Ce qu\'il faut connaître');
  const zone=h('<div></div>');body.append(zone);
  const qs=shuffle(QCM);let i=0;
  serie(zone,10,()=>{const q=qs[i++%qs.length];return {prompt:q.q,options:q.o,correct:0,explain:q.e}});

/* ---------- 6. RÉDIGER ---------- */
function rediger(){
  const body=chrome('Expliquer avec ses mots');
  let idx=0;
  const tabs=h(`<div class="tabs">${REDAC.map((r,i)=>`<button data-i="${i}">${['Paléolithique','Lascaux','Néolithique'][i]}</button>`).join('')}</div>`);
  body.append(tabs);const zone=h('<div></div>');body.append(zone);
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;go()});
  function go(){
    tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===idx));
    const r=REDAC[idx];zone.innerHTML='';
    zone.append(h(`<p class="prompt">${r.q}</p>`));
    zone.append(h(`<p class="muted small">Écris ta réponse comme au contrôle, avec des phrases. Ensuite, compare avec la correction.</p>`));
    const ta=h(`<textarea aria-label="Ta réponse" placeholder="Ta réponse…"></textarea>`);ta.value=store.get('draft'+idx,'');
    ta.oninput=()=>store.set('draft'+idx,ta.value);zone.append(ta);
    const b=h('<button class="main-btn">Voir la correction</button>');zone.append(b);
    b.onclick=()=>{
      b.remove();
      zone.append(h(`<p class="prompt" style="margin-top:20px">Coche les idées que tu as écrites</p>`));
      const list=h('<div></div>');zone.append(list);
      const res=h('<p class="muted"></p>');
      r.c.forEach(c=>{const l=h(`<label class="check"><input type="checkbox"><span>${c}</span></label>`);l.querySelector('input').onchange=count;list.append(l)});
      zone.append(res);
      function count(){const n=list.querySelectorAll('input:checked').length;res.innerHTML=`<b>${n} idée${n>1?'s':''} sur ${r.c.length}.</b> ${n===r.c.length?'Réponse complète, bravo !':n>=r.c.length-2?'Presque complet : relis la correction pour ajouter ce qui manque.':'Relis la correction, puis réessaie un peu plus tard sans regarder.'}`}
      count();
      zone.append(h(`<p class="prompt" style="margin-top:20px">Une réponse modèle</p>`));
      zone.append(h(`<div class="model">${r.m}</div>`));
      const again=h('<button class="ghost-btn">Effacer ma réponse et recommencer</button>');again.onclick=()=>{store.set('draft'+idx,'');go()};zone.append(again);
    };
  }
  go();
}

/* ---------- EXAMEN BLANC ---------- */
function examQuestions(){
  const qs=[];
  pick(DEFS,4).forEach(([w,d])=>{
    if(Math.random()<.5) qs.push({type:'qcm',cat:'Définir',prompt:`Que veut dire « ${w} » ?`,options:[d,...pick(DEFS.filter(x=>x[0]!==w),3).map(x=>x[1])],correct:0,explain:''});
    else qs.push({type:'qcm',cat:'Définir',prompt:`Quel mot correspond à cette définition ? « ${d} »`,options:[w,...pick(DEFS.filter(x=>x[0]!==w),3).map(x=>x[0])],correct:0,explain:''});
  });
  for(let i=0;i<3;i++) qs.push({type:'qcm',cat:'Dater',...dateQ()});
  for(let i=0;i<2;i++) qs.push({type:'qcm',cat:'Période',...periodeQ()});
  const wn=pick(Object.keys(MAPS.world.targets).filter(n=>n!=='Lascaux'),2), rn=pick(Object.keys(MAPS.region.targets),2);
  wn.forEach(n=>qs.push({type:'map',cat:'Situer',key:'world',name:n}));
  rn.forEach(n=>qs.push({type:'map',cat:'Situer',key:'region',name:n}));
  for(let i=0;i<3;i++){const y=randYear(),c=centuryOf(y),e=y<0?' av. J.-C.':'';
    const wrong=[...new Set([c-1,c+1,c+2,c-2].filter(x=>x>0))].slice(0,2).map(x=>toRoman(x)+'e siècle'+e);
    wrong.push(toRoman(c)+'e siècle'+(y<0?'':' av. J.-C.'));
    qs.push({type:'qcm',cat:'Siècle',prompt:`En quel siècle se situe l'année ${fmtYear(y)} ?`,options:[toRoman(c)+'e siècle'+e,...wrong],correct:0,explain:explainCentury(y)});}
  pick(QCM,4).forEach(q=>qs.push({type:'qcm',cat:'Connaître',prompt:q.q,options:q.o,correct:0,explain:q.e}));
  return shuffle(qs).slice(0,20);
}
function examen(){
  const body=chrome('Examen blanc');
  const qs=examQuestions();let k=0,good=0;const misses=[];
  const setP=bar(body);const inner=h('<div></div>');body.append(inner);
  const step=()=>{
    setP(k/qs.length);window.scrollTo(0,0);
    if(k===qs.length){
      const best=store.get('best',null);if(best===null||good>best)store.set('best',good);
      inner.innerHTML='';
      inner.append(h(`<div class="score"><div class="n">${good}/20</div><p class="prompt">${good>=18?'Excellent, tu es prête !':good>=14?'Très bien ! Encore un petit effort sur les erreurs.':good>=10?'C\'est en bonne voie. Revois les points ci-dessous.':'Courage : refais les exercices de révision puis retente l\'examen.'}</p></div>`));
      if(misses.length){const r=h('<div class="recap"><p class="prompt">À revoir</p></div>');misses.forEach(m=>r.append(h(`<div class="it"><b>${m.cat} : ${m.q}</b>Réponse : ${esc(m.a)}</div>`)));inner.append(r)}
      const a=h('<button class="main-btn">Refaire un examen</button>');a.onclick=examen;inner.append(a);
      const hm=h('<button class="ghost-btn">Retour au menu</button>');hm.onclick=()=>location.hash='';inner.append(hm);return;
    }
    const q=qs[k];const sub=`Question ${k+1} sur 20 (${q.cat})`;
    const done=(ok,ans)=>{if(ok)good++;else misses.push({cat:q.cat,q:q.type==='map'?`situer ${q.name}`:q.prompt,a:ans});k++;step()};
    if(q.type==='map') mapQ(inner,{key:q.key,name:q.name,sub,onDone:(ok)=>done(ok,'voir la carte')});
    else qcm(inner,{...q,sub,onDone:done});
  };step();
}

window.addEventListener('hashchange',route);route();
