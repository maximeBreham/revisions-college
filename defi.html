<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Défi du jour</title>
<meta name="theme-color" content="#F5F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A26" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<meta name="apple-mobile-web-app-title" content="Révisions">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="exercices/moteur.css">
<style>
.top a.back{display:grid;place-items:center;text-decoration:none;color:inherit}
.score .msg{font-family:var(--head);font-weight:600;font-size:22px;margin:8px 0 0}
.flamme{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 6px;font-family:var(--head);font-weight:600;font-size:20px}
.semaine{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
.semaine span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;border:2px solid var(--line);background:var(--card);color:var(--ink-soft)}
.semaine span.fait{background:var(--green);border-color:var(--green);color:var(--on-ink)}
.semaine span.auj{outline:3px solid var(--hl);outline-offset:1px}
.recap{margin-top:8px}
.recap .it .m{color:var(--ink-soft);font-size:13px}
.vide{background:var(--card);border:2px dashed var(--line);border-radius:var(--r-md);padding:18px;margin-top:12px}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="catalogue.js"></script>
<script src="suivi.js"></script>
<script src="exercices/moteur.js"></script>
<script>
const { h, esc } = Moteur;
const app = document.getElementById("app");
const NB_QUESTIONS = 5;
const JOUR = 86400000;

// Les révisions qui ont un fichier de questions ; l'id de la banque est le nom du fichier sans .js
const sources = REVISIONS.filter(r => r.exercices).map(r => ({ r, banque: r.exercices.replace(/\.js$/, "") }));

function charger(src) {
  return new Promise(ok => { const s = document.createElement("script"); s.src = src; s.onload = s.onerror = ok; document.head.append(s); });
}

// Hasard reproductible : le même jour donne les mêmes questions, même si on recharge la page.
function hasardDu(texte) {
  let a = 0; for (const c of texte) a = Math.imul(a ^ c.charCodeAt(0), 2654435761);
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function avecHasard(hasard, fn) { const r = Math.random; Math.random = hasard; try { return fn(); } finally { Math.random = r; } }

// Plus le contrôle est proche, plus la matière revient souvent ; les anciens chapitres reviennent un peu.
function poids(r) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(r.date || "");
  if (!m) return 2;
  const auj = new Date(); auj.setHours(0, 0, 0, 0);
  const n = Math.round((new Date(+m[1], +m[2] - 1, +m[3]) - auj) / JOUR);
  return n < 0 ? 1 : n <= 14 ? 4 : 2;
}

function tirerSource(dispo) {
  const total = dispo.reduce((s, x) => s + poids(x.r), 0);
  let t = Math.random() * total;
  for (const x of dispo) { t -= poids(x.r); if (t < 0) return x; }
  return dispo[dispo.length - 1];
}

// Choisit les questions : d'abord jusqu'à 2 questions ratées les jours précédents, puis au hasard.
function plan() {
  const dispo = sources.filter(x => Moteur.banques[x.banque]);
  if (!dispo.length) return [];
  const choix = [];
  const revoir = Object.keys(Suivi.lire("revoir", {})).filter(cle => {
    const [b, g] = cle.split(":"); return dispo.some(x => x.banque === b) && Moteur.banques[b][g];
  });
  Moteur.shuffle(revoir).slice(0, 2).forEach(cle => choix.push(cle));
  for (let essai = 0; choix.length < NB_QUESTIONS && essai < 50; essai++) {
    const x = tirerSource(dispo);
    const g = Moteur.pick(Object.keys(Moteur.banques[x.banque]), 1)[0];
    const cle = x.banque + ":" + g;
    if (!choix.includes(cle) || essai > 30) choix.push(cle);
  }
  return choix.map(cle => {
    const [b, g] = cle.split(":");
    const source = dispo.find(x => x.banque === b);
    return { cle, matiere: (MATIERES[source.r.matiere] || { nom: source.r.matiere }).nom, question: Moteur.banques[b][g]() };
  });
}

function entete(titre) {
  app.innerHTML = "";
  app.append(h(`<div class="top"><a class="back" href="./" aria-label="Retour à l'accueil">‹</a><h2>${titre}</h2></div>`));
}

function jouer(questions, etat, { compte }) {
  entete(compte ? "Défi du jour" : "Pour le plaisir");
  const bar = h('<div class="bar"><i></i></div>'); app.append(bar);
  const zone = h("<div></div>"); app.append(zone);
  const etape = () => {
    bar.firstChild.style.width = (etat.k / questions.length * 100) + "%";
    window.scrollTo(0, 0);
    if (etat.k >= questions.length) return terminer(etat, { compte });
    const { cle, matiere, question } = questions[etat.k];
    question.run(zone, `${esc(matiere)} · question ${etat.k + 1} sur ${questions.length}`, (ok, reponse) => {
      etat.k++;
      etat.resultats.push({ cle, ok });
      if (ok) etat.bons++; else etat.rates.push({ matiere, cat: question.cat, reponse: String(reponse ?? "") });
      if (compte) Suivi.ecrire("jour", etat);
      etape();
    });
  };
  etape();
}

function terminer(etat, { compte }) {
  if (!etat.fini) {
    etat.fini = true;
    // Une question ratée revient les jours suivants ; réussie, elle sort de la liste.
    const revoir = Suivi.lire("revoir", {});
    etat.resultats.forEach(({ cle, ok }) => { if (ok) delete revoir[cle]; else revoir[cle] = (revoir[cle] || 0) + 1; });
    Suivi.ecrire("revoir", revoir);
    if (compte) {
      const jours = Suivi.lire("jours", []);
      if (!jours.includes(etat.date)) jours.push(etat.date);
      Suivi.ecrire("jours", jours.slice(-400));
      Suivi.ecrire("jour", etat);
    }
  }
  entete(compte ? "Défi du jour" : "Pour le plaisir");
  const n = etat.resultats.length, b = etat.bons;
  const msg = b === n ? "Sans faute, bravo !" : b >= n - 1 ? "Très bien !" : b >= n / 2 ? "Pas mal, les erreurs reviendront pour t'entraîner." : "Courage, les erreurs reviendront pour t'entraîner.";
  app.append(h(`<div class="score"><div class="n">${b}/${n}</div><p class="msg">${msg}</p></div>`));
  const s = Suivi.serie();
  app.append(h(`<p class="flamme">🔥 ${s} jour${s > 1 ? "s" : ""} d'affilée</p>`));
  app.append(h(`<div class="semaine" aria-label="Les 7 derniers jours">${Suivi.semaine().map(j => `<span class="${j.fait ? "fait" : ""} ${j.aujourdhui ? "auj" : ""}">${j.lettre}</span>`).join("")}</div>`));
  if (etat.rates.length) {
    const r = h('<div class="recap"><p class="prompt">À revoir</p></div>');
    etat.rates.forEach(m => r.append(h(`<div class="it"><span class="m">${esc(m.matiere)}</span><b>${esc(m.cat)}</b>Réponse : ${m.reponse}</div>`)));
    app.append(r);
  }
  if (compte) app.append(h('<p class="muted small" style="text-align:center;margin-top:16px">Le prochain défi t\'attend demain.</p>'));
  const encore = h('<button class="main-btn">5 autres questions pour le plaisir</button>');
  encore.onclick = () => jouer(plan(), nouvelEtat(), { compte: false });
  app.append(encore);
  const retour = h('<a class="ghost-btn" href="./" style="text-align:center;text-decoration:none;color:inherit">Retour à l\'accueil</a>');
  app.append(retour);
}

const nouvelEtat = () => ({ date: Suivi.aujourdhui(), k: 0, bons: 0, rates: [], resultats: [], fini: false });

Promise.all(sources.map(x => charger("exercices/" + x.r.exercices))).then(() => {
  const questions = avecHasard(hasardDu("defi " + Suivi.aujourdhui()), plan);
  if (!questions.length) {
    entete("Défi du jour");
    app.append(h('<p class="vide">Pas encore de questions pour le défi. Elles arrivent avec les prochaines révisions !</p>'));
    return;
  }
  const etat = Suivi.etatDuJour() || nouvelEtat();
  if (etat.fini) terminer(etat, { compte: true });
  else jouer(questions, etat, { compte: true });
});
</script>
</body>
</html>
